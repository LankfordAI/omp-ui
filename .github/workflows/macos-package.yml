name: macOS Package

on:
  workflow_call:
    inputs:
      version:
        description: Package version, with or without a leading v.
        required: true
        type: string
      ref:
        description: >-
          Git ref (SHA preferred) to check out. Empty keeps the caller's
          context commit; a nightly passes the packaged SHA so the lane steps
          and the tree both come from that ref (issue #480).
        required: false
        type: string
        default: ""
      notarize:
        description: Notarize and staple the signed package.
        required: true
        type: boolean
      targets:
        description: JSON matrix whose include entries contain arch and runner.
        required: true
        type: string
      release_tag:
        description: >-
          GitHub release tag to upload the DMG, ZIP, and checksum file to.
          Empty stages them as a workflow artifact named macos-package-<arch>
          for the caller instead (issue #485).
        required: false
        type: string
        default: ""
    outputs:
      targets:
        description: The target matrix used to build the packages.
        value: ${{ jobs.package.outputs.targets }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.runner }}
    outputs:
      targets: ${{ steps.targets.outputs.value }}
    steps:
      - id: targets
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
        run: echo "value=$TARGETS" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke-test node-pty under Electron
        # The lane ships node-pty's Node-API prebuild unrebuilt (issue #484);
        # this proves the host-arch prebuild loads and spawns inside Electron's
        # runtime.
        run: npm run smoke:pty --workspace @omp-ui/desktop
      - name: Stamp package version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          current="$(node -p 'require("./packages/desktop/package.json").version')"
          if [ "$current" = "$version" ]; then
            echo "package.json already at $current — nothing to stamp"
          else
            npm version "$version" --no-git-tag-version --workspace @omp-ui/desktop
          fi
      - name: Package signed macOS build (with retries, notarization deferred)
        shell: bash
        run: |
          # dmgbuild can exhaust its own detach retries while the runner still
          # holds the fresh volume (issue #278). A bounded step retry recovers.
          status=0
          for attempt in 1 2 3; do
            if npm run package:mac --workspace @omp-ui/desktop -- --${{ matrix.arch }} --publish never --config.mac.notarize=false; then
              status=0
              break
            else
              status=$?
            fi
            if (( attempt >= 3 )); then
              break
            fi
            echo "::warning::package:mac attempt $attempt failed (exit $status); retrying in 15s"
            sleep 15
          done
          exit "$status"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Notarize macOS build (notarytool with retries)
        if: ${{ inputs.notarize }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packages/desktop/scripts/notarize-macos-preview.sh "${{ matrix.arch }}"
      - name: Verify signed macOS package
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          bash packages/desktop/scripts/verify-macos-package.sh
          "${{ matrix.arch }}"
          "${{ inputs.notarize && 'full' || 'signed-only' }}"
      - name: Stage macOS package for caller
        if: ${{ inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*-mac-preview-${{ matrix.arch }}.dmg
            packages/desktop/dist/*-mac-preview-${{ matrix.arch }}.zip
            packages/desktop/dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload macOS assets to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dist="packages/desktop/dist"
          dmgs=("$dist"/*-mac-preview-"$ARCH".dmg)
          zips=("$dist"/*-mac-preview-"$ARCH".zip)
          (( ${#dmgs[@]} == 1 ))
          (( ${#zips[@]} == 1 ))
          gh release upload "$RELEASE_TAG" --clobber \
            "${dmgs[0]}" \
            "${zips[0]}" \
            "$dist/SHA256SUMS-macos-$ARCH.txt"
