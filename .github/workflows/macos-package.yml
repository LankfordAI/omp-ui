name: macOS Package

on:
  workflow_call:
    inputs:
      version:
        description: Package version, with or without a leading v.
        required: true
        type: string
      notarize:
        description: Notarize and staple the signed package.
        required: true
        type: boolean
      targets:
        description: JSON matrix whose include entries contain arch and runner.
        required: true
        type: string
    outputs:
      targets:
        description: The target matrix used to build the packages.
        value: ${{ jobs.package.outputs.targets }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.runner }}
    outputs:
      targets: ${{ steps.targets.outputs.value }}
    steps:
      - id: targets
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
        run: echo "value=$TARGETS" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp package version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          current="$(node -p 'require("./packages/desktop/package.json").version')"
          if [ "$current" = "$version" ]; then
            echo "package.json already at $current — nothing to stamp"
          else
            npm version "$version" --no-git-tag-version --workspace @omp-ui/desktop
          fi
      - name: Fetch the pinned verifier browser
        run: npm run fetch:verifier-browser --workspace @omp-ui/host
      - name: Build plan-doc, host verifier page, and desktop bundles
        run: npm run build
      - name: Package and smoke-test the macOS host
        # The desktop client embeds this lane's host layout as its cold-start
        # seed (issue #442 §10.1), so it is packaged first; the record is the
        # release evidence release-manifest consumes.
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          lane="mac-${{ matrix.arch }}"
          npm run package:host --workspace @omp-ui/host -- --lane "$lane"
          npm run smoke:package --workspace @omp-ui/host -- --lane "$lane" \
            --record "$PWD/package-records/package-record-${lane}.json" --release-tag "v${INPUT_VERSION#v}"
      - name: Package signed macOS build (with retries, notarization deferred)
        shell: bash
        run: |
          # dmgbuild can exhaust its own detach retries while the runner still
          # holds the fresh volume (issue #278). A bounded step retry recovers.
          # electron-builder directly: `npm run build` above already produced
          # the bundles the `package:mac` script would rebuild.
          status=0
          for attempt in 1 2 3; do
            if npm exec --workspace @omp-ui/desktop -- electron-builder --mac --${{ matrix.arch }} --publish never --config.mac.notarize=false; then
              status=0
              break
            else
              status=$?
            fi
            if (( attempt >= 3 )); then
              break
            fi
            echo "::warning::electron-builder attempt $attempt failed (exit $status); retrying in 15s"
            sleep 15
          done
          exit "$status"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Notarize macOS build (notarytool with retries)
        if: ${{ inputs.notarize }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packages/desktop/scripts/notarize-macos-preview.sh "${{ matrix.arch }}"
      - name: Verify signed macOS package
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          bash packages/desktop/scripts/verify-macos-package.sh
          "${{ matrix.arch }}"
          "${{ inputs.notarize && 'full' || 'signed-only' }}"
      - name: Stage macOS package evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-record-mac-${{ matrix.arch }}
          path: package-records/
          if-no-files-found: error
          retention-days: 1
      - name: Stage macOS package for caller
        # Two roots, so the artifact keeps `desktop/dist/...` and
        # `host/out/mac-<arch>/...` beneath `packages/`.
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*-mac-preview-${{ matrix.arch }}.dmg
            packages/desktop/dist/*-mac-preview-${{ matrix.arch }}.zip
            packages/desktop/dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
            packages/host/out/mac-${{ matrix.arch }}/omp-ui-host-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
