name: macOS Package

on:
  workflow_call:
    inputs:
      version:
        description: Package version, with or without a leading v.
        required: true
        type: string
      ref:
        description: >-
          Git ref (SHA preferred) to check out. Empty keeps the caller's
          context commit; a nightly passes the packaged SHA so the lane steps
          and the tree both come from that ref (issue #480).
        required: false
        type: string
        default: ""
      notarize:
        description: Notarize and staple the signed package.
        required: true
        type: boolean
      release_tag:
        description: >-
          GitHub release tag to upload the DMG, ZIP, and checksum file to.
          Empty stages them as a workflow artifact named macos-package-<arch>
          for the caller instead (issue #485).
        required: false
        type: string
        default: ""
    secrets:
      CSC_LINK:
        description: Base64 Developer ID Application certificate (.p12) for electron-builder.
        required: true
      CSC_KEY_PASSWORD:
        description: Password of the CSC_LINK certificate.
        required: true
      APPLE_ID:
        description: Apple ID that notarytool submits with. Read only when notarize is true.
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        description: App-specific password for that Apple ID. Read only when notarize is true.
        required: true
      APPLE_TEAM_ID:
        description: >-
          Developer team ID. notarytool submits with it and the verify step
          asserts the signature carries it, notarized or not.
        required: true

jobs:
  package:
    strategy:
      fail-fast: false
      # Fixed target set: the six release distributables are two DMG+ZIP
      # pairs (docs/releases.md). Callers cannot widen or redirect it —
      # the matrix and runner are literals here, never inputs (issue #628).
      matrix:
        arch: [arm64, x64]
    # Both architectures package on Apple Silicon: the Intel runner is about
    # twice as slow at every step and nothing in the lane executes the app
    # (issue #485).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke-test node-pty under Electron
        # The lane ships node-pty's Node-API prebuild unrebuilt (issue #484);
        # this proves the host-arch prebuild loads and spawns inside Electron's
        # runtime.
        run: npm run smoke:pty --workspace @omp-ui/desktop
      - name: Stamp package version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          current="$(node -p 'require("./packages/desktop/package.json").version')"
          if [ "$current" = "$version" ]; then
            echo "package.json already at $current — nothing to stamp"
          else
            npm version "$version" --no-git-tag-version --workspace @omp-ui/desktop
          fi
      - name: Package signed macOS build (with retries, notarization deferred)
        shell: bash
        run: |
          # dmgbuild can exhaust its own detach retries while the runner still
          # holds the fresh volume (issue #278). A bounded step retry recovers.
          status=0
          for attempt in 1 2 3; do
            if npm run package:mac --workspace @omp-ui/desktop -- "--$ARCH" --publish never --config.mac.notarize=false; then
              status=0
              break
            else
              status=$?
            fi
            if (( attempt >= 3 )); then
              break
            fi
            echo "::warning::package:mac attempt $attempt failed (exit $status); retrying in 15s"
            sleep 15
          done
          exit "$status"
        env:
          ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Notarize macOS build (notarytool with retries)
        if: ${{ inputs.notarize }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCH: ${{ matrix.arch }}
        run: bash packages/desktop/scripts/notarize-macos.sh "$ARCH"
      - name: Verify signed macOS package
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCH: ${{ matrix.arch }}
          MODE: ${{ inputs.notarize && 'full' || 'signed-only' }}
        run: bash packages/desktop/scripts/verify-macos-package.sh "$ARCH" "$MODE"
      - name: Stage macOS package for caller
        if: ${{ inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*-mac-${{ matrix.arch }}.dmg
            packages/desktop/dist/*-mac-${{ matrix.arch }}.zip
            packages/desktop/dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload macOS assets to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dist="packages/desktop/dist"
          dmgs=("$dist"/*-mac-"$ARCH".dmg)
          zips=("$dist"/*-mac-"$ARCH".zip)
          (( ${#dmgs[@]} == 1 ))
          (( ${#zips[@]} == 1 ))
          gh release upload "$RELEASE_TAG" --clobber \
            "${dmgs[0]}" \
            "${zips[0]}" \
            "$dist/SHA256SUMS-macos-$ARCH.txt"
