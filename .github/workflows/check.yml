name: Check

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runs-on labels for the check job.
        required: true
        type: string
      hosted:
        description: >-
          True on a GitHub-hosted runner. Installs Xvfb so the browser pane
          smoke keeps its last rung, and lifts Ubuntu 24.04's unprivileged
          user-namespace restriction so Electron's sandbox can start; the
          image's chrome-sandbox helper is not setuid (issue #626).
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare hosted runner for the Electron smokes
        if: ${{ inputs.hosted }}
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:pty --workspace @omp-ui/desktop
      - run: npm run lint
        # npm ci validates the dependency tree but not workspace metadata —
        # a version stamped without regenerating the lock (issue #90) passes
        # it. Regenerating must be a no-op on a synced tree; any diff is drift.
      - name: Assert lockfile in sync
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json
      - run: npm run typecheck
      - run: node --test scripts/release-artifacts.test.mjs
      - run: node --test scripts/release-notes.test.mjs
      - run: node --test scripts/close-landed-issues.test.mjs
      - run: npm test
      - run: npm run test:live
      - run: npm run build
      - name: Smoke the browser pane under real Electron
        # Prefer the runner session, then headless Ozone, then Xvfb only when Chromium painted no frame.
        shell: bash
        run: |
          set -uo pipefail
          smoke() { npm run smoke:browser-pane --workspace @omp-ui/desktop -- --once "$@"; }
          args=(--out=out/browser-pane-smoke/session)
          if [ -z "${WAYLAND_DISPLAY:-}${DISPLAY:-}" ]; then
            args=(--out=out/browser-pane-smoke/headless --ozone-platform=headless)
          fi
          smoke "${args[@]}"; rc=$?
          if [ "$rc" -eq 3 ] && command -v xvfb-run >/dev/null; then
            xvfb-run -a --server-args='-screen 0 1600x1000x24' \
              npm run smoke:browser-pane --workspace @omp-ui/desktop -- --once --out=out/browser-pane-smoke/xvfb; rc=$?
          fi
          exit "$rc"
      - name: Publish the browser pane smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-pane-smoke-summary
          path: packages/desktop/out/browser-pane-smoke/**/summary.json
          if-no-files-found: error
          retention-days: 14
