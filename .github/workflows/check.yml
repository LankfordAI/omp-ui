name: Check

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runs-on labels for the check jobs.
        required: true
        type: string
      hosted:
        description: >-
          True on a GitHub-hosted runner. Installs Xvfb so the browser pane
          smoke keeps its last rung, and lifts Ubuntu 24.04's unprivileged
          user-namespace restriction so Electron's sandbox can start; the
          image's chrome-sandbox helper is not setuid (issue #626).
        required: true
        type: boolean
      shards:
        description: >-
          JSON array of live-suite vitest shard indices, e.g. ["1","2","3","4"].
          One shard index runs the whole suite; use it on runners whose capacity
          is shared (the gfx1201 pool ships releases).
        required: true
        type: string
      unit_shards:
        description: >-
          JSON array of desktop unit-test vitest shard indices, e.g. ["1","2"].
          Use ["1"] on shared self-hosted runners.
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
        # npm ci validates the dependency tree but not workspace metadata —
        # a version stamped without regenerating the lock (issue #90) passes
        # it. Regenerating must be a no-op on a synced tree; any diff is drift.
      - name: Assert lockfile in sync
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json
      - run: npm run typecheck
      - run: node --test scripts/release-artifacts.test.mjs scripts/release-notes.test.mjs scripts/close-landed-issues.test.mjs scripts/check-commit-refs.test.mjs
      - run: npm run themes:check --workspace @omp-ui/desktop
      - run: npm test --workspace @omp-ui/core --workspace @omp-ui/host-lite --workspace @omp-ui/server
      # The session bundle is a generated artifact the lite member ships; this
      # rebuilds it from current sources so a drift-breaking edit to the
      # bundled closure fails CI instead of shipping (bundle-session.mjs header).
      - name: Build the host-lite session bundle (drift gate)
        run: node packages/host-lite/scripts/bundle-session.mjs

  desktop-unit:
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.unit_shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run desktop unit tests shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:unit --workspace @omp-ui/desktop -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # One supported harness per policy (bump MIN_SUPPORTED_OMP when a release
  # adopts features from a newer omp; below-floor users auto-upgrade at launch,
  # see packages/core/src/harness-floor.ts). The pin below tracks that floor —
  # currently both are 19.0.0; bump the two together and keep the sha256 in
  # sync with the release asset. The suite stays serial inside each
  # shard (vitest.live.config.ts) — every test boots a real omp and parallel
  # boots starve one another — so wall time falls by splitting FILES across
  # shards with vitest --shard, never by raising maxWorkers.
  live:
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision OMP 19.0.0 (the supported harness) for live tests
        id: live-omp
        shell: bash
        run: |
          set -euo pipefail
          version=19.0.0
          sha256=c7cc5c8d505053c8ffaf180417e5d5c781235b9d936f286810560151120109bf
          omp="$(mktemp -d "$RUNNER_TEMP/omp-live.XXXXXX")/omp"
          curl --fail --silent --show-error --location --retry 3 --output "$omp" \
            "https://github.com/can1357/oh-my-pi/releases/download/v${version}/omp-linux-x64"
          printf '%s  %s\n' "$sha256" "$omp" | sha256sum --check
          chmod 0755 "$omp"
          "$omp" --version
          printf 'path=%s\n' "$omp" >> "$GITHUB_OUTPUT"
      - name: Run live proofs shard ${{ matrix.shard }}/${{ strategy.job-total }} against OMP 19.0.0
        run: npm run test:live --workspace @omp-ui/desktop -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          OMP_UI_OMP_PATH: ${{ steps.live-omp.outputs.path }}

  smokes:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare hosted runner for the Electron smokes
        if: ${{ inputs.hosted }}
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:pty --workspace @omp-ui/desktop
      - run: npm run smoke:knowledge-vault:run --workspace @omp-ui/desktop
        id: knowledge-vault-smoke
      - name: Smoke the browser pane under real Electron
        id: browser-pane-smoke
        # Prefer the runner session, then headless Ozone, then Xvfb only when Chromium painted no frame.
        shell: bash
        run: |
          set -uo pipefail
          smoke() { npm run smoke:browser-pane:run --workspace @omp-ui/desktop -- --once "$@"; }
          args=(--out=out/browser-pane-smoke/session)
          if [ -z "${WAYLAND_DISPLAY:-}${DISPLAY:-}" ]; then
            args=(--out=out/browser-pane-smoke/headless --ozone-platform=headless)
          fi
          # On the ephemeral hosted runner there is no real GPU: software raster,
          # where the #653 kick step passes vacuously by design. The gfx1201 pool
          # (hardwareAcceleration true) keeps gating the GPU compositor.
          if [ "${{ inputs.hosted }}" = "true" ]; then
            args+=(--software)
          fi
          smoke "${args[@]}"; rc=$?
          if [ "$rc" -eq 3 ] && command -v xvfb-run >/dev/null; then
            software=()
            if [ "${{ inputs.hosted }}" = "true" ]; then
              software=(--software)
            fi
            xvfb-run -a --server-args='-screen 0 1600x1000x24' \
              npm run smoke:browser-pane:run --workspace @omp-ui/desktop -- --once "${software[@]}" --out=out/browser-pane-smoke/xvfb; rc=$?
          fi
          exit "$rc"
      - name: Smoke the plan verifier under headless Electron
        id: plan-verifier-smoke
        # The verifier window once SIGSEGV'd main on headless Ozone (#820);
        # run this rung headless unconditionally so the crash class stays gated.
        shell: bash
        run: |
          set -uo pipefail
          smoke() { npm run smoke:plan-verifier:run --workspace @omp-ui/desktop -- --once --ozone-platform=headless "$@"; }
          smoke --out=out/plan-verifier-smoke/headless; rc=$?
          if [ "$rc" -eq 3 ] && command -v xvfb-run >/dev/null; then
            xvfb-run -a --server-args='-screen 0 1600x1000x24' \
              npm run smoke:plan-verifier:run --workspace @omp-ui/desktop -- --once --out=out/plan-verifier-smoke/xvfb; rc=$?
          fi
          exit "$rc"
      - name: Publish the knowledge vault smoke summary
        if: ${{ always() && (steps.knowledge-vault-smoke.outcome == 'success' || steps.knowledge-vault-smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-vault-smoke-summary
          path: packages/desktop/out/knowledge-vault-smoke/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish the plan verifier smoke summary
        if: ${{ always() && (steps.plan-verifier-smoke.outcome == 'success' || steps.plan-verifier-smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-verifier-smoke-summary
          path: packages/desktop/out/plan-verifier-smoke/**/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish the browser pane smoke summary
        if: ${{ always() && (steps.browser-pane-smoke.outcome == 'success' || steps.browser-pane-smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-pane-smoke-summary
          path: packages/desktop/out/browser-pane-smoke/**/summary.json
          if-no-files-found: error
          retention-days: 14
