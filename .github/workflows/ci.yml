name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: [self-hosted, gfx1201]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
        # npm ci validates the dependency tree but not workspace metadata —
        # a version stamped without regenerating the lock (issue #90) passes
        # it. Regenerating must be a no-op on a synced tree; any diff is drift.
      - name: Assert lockfile in sync
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json
      - run: npm run typecheck
      - run: node --test scripts/release-artifacts.test.mjs
      - run: node --test scripts/release-notes.test.mjs
      - run: npm test
      - run: npm run test:live
      - run: npm run build

  # The host SEA packages and boots on a stock Linux runner (issue #442 §12):
  # the same package/smoke pair the release lanes run, record writer included.
  # Release publication lives in release.yml.
  host-package-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:verifier-browser --workspace @omp-ui/host
      - run: npm run build
      - run: npm run package:host --workspace @omp-ui/host -- --lane linux-x64
      - run: npm run smoke:package --workspace @omp-ui/host -- --lane linux-x64 --record "$PWD/package-record-linux-x64.json"
