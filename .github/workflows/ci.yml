name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Stale pushes to the same PR supersede one another. Push runs get their own
  # group per SHA so two commits landing on main while the gfx1201 pool is
  # busy never share GitHub's single pending slot (which would silently drop a
  # trunk commit's CI); each push run executes or queues independently.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # gfx1201 is the org's self-hosted Linux runner pool (labels linux,rocm,
  # gfx1201) that also builds the shipped Linux artifacts (release.yml
  # release-linux, nightly.yml linux-x64). Finding N1: same-repo PR code
  # running on that persistent pool is exposure the in-repo approval policy
  # alone cannot bound, so PR-triggered checks run on the ephemeral hosted
  # runner and the pool serves only push triggers — refs trunk-controlled by
  # definition. Fork PRs route to the same hosted runner via check-fork.
  check:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/check.yml
    with:
      runner: '["self-hosted", "gfx1201"]'
      hosted: false
      shards: '["1"]'

  check-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/check.yml
    with:
      runner: '["ubuntu-latest"]'
      hosted: true
      shards: '["1","2","3","4"]'

  check-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/check.yml
    with:
      runner: '["ubuntu-latest"]'
      hosted: true
      shards: '["1","2","3","4"]'

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Verify gradle wrapper jar
        run: |
          expected="$(cat android/gradle/wrapper/gradle-wrapper.jar.sha256)"
          echo "$expected  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Install pinned Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Check Android release verification boundaries
        run: node --test android/scripts/verify-release.test.mjs
      - name: Compile, test, and lint Android without signing credentials
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
