name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: [self-hosted, gfx1201]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate AppStream metainfo
        run: |
          sudo apt-get update && sudo apt-get install -y appstream
          appstreamcli validate --no-net packages/desktop/build/ai.lankford.omp-ui.metainfo.xml
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
