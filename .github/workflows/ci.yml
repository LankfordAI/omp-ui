name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # gfx1201 is the org's self-hosted Linux runner pool (labels linux,rocm,
  # gfx1201) that also builds the shipped Linux artifacts (release.yml
  # release-linux, nightly.yml linux-x64). Finding N1: same-repo PR code
  # running on that persistent pool is exposure the in-repo approval policy
  # alone cannot bound, so PR-triggered checks run on the ephemeral hosted
  # runner and the pool serves only push triggers — refs trunk-controlled by
  # definition. Fork PRs route to the same hosted runner via check-fork.
  check:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/check.yml
    with:
      runner: '["self-hosted", "gfx1201"]'
      hosted: false

  check-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/check.yml
    with:
      runner: '["ubuntu-latest"]'
      hosted: true

  check-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/check.yml
    with:
      runner: '["ubuntu-latest"]'
      hosted: true

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify gradle wrapper jar
        run: |
          expected="$(cat android/gradle/wrapper/gradle-wrapper.jar.sha256)"
          echo "$expected  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Install pinned Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Check Android release verification boundaries
        run: node --test android/scripts/verify-release.test.mjs
      - name: Compile, test, and lint Android without signing credentials
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
