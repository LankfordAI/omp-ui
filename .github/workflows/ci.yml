name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # gfx1201 is the org's self-hosted Linux runner pool (labels linux,rocm,
  # gfx1201) that also builds the shipped Linux artifacts (release.yml
  # release-linux, nightly.yml linux-x64), so only same-repo events run there;
  # fork PRs go to check-fork. A pull_request run executes the workflow from
  # the PR's merge ref, so this guard routes; the repository's
  # all-external-contributors approval policy is what gates (issue #626).
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/check.yml
    with:
      runner: '["self-hosted", "gfx1201"]'
      hosted: false

  check-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/check.yml
    with:
      runner: '["ubuntu-latest"]'
      hosted: true

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Check Android release verification boundaries
        run: node --test android/scripts/verify-release.test.mjs
      - name: Compile, test, and lint Android without signing credentials
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
