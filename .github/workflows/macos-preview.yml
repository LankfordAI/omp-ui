name: macOS Preview

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: >-
          Notarize with Apple. Set false during a Notary Service outage
          (issue #124) to still get a signed, non-notarized artifact.
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: verify
    uses: ./.github/workflows/macos-package.yml
    with:
      version: 0.0.0-preview.${{ github.run_number }}
      notarize: ${{ inputs.notarize == 'true' }}
      targets: >-
        {"include":[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]}
    secrets: inherit

  publish:
    needs: package
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged macOS preview
        uses: actions/download-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: packages/desktop/dist
      - name: Upload macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: omp-ui-macos-${{ matrix.arch }}-${{ github.sha }}-${{ inputs.notarize == 'true' && 'notarized' || 'signed-only' }}
          path: |
            packages/desktop/dist/*-mac-preview-${{ matrix.arch }}.dmg
            packages/desktop/dist/*-mac-preview-${{ matrix.arch }}.zip
            packages/desktop/dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
