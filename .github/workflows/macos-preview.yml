name: macOS Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp preview version
        run: npm version "0.0.0-preview.${GITHUB_RUN_NUMBER}" --no-git-tag-version
        working-directory: packages/desktop
      - name: Rebuild node-pty
        run: npm run rebuild:native --workspace @omp-ui/desktop -- --arch="${{ matrix.arch }}"
      - name: Package macOS preview
        run: npm run package:mac --workspace @omp-ui/desktop -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify macOS preview package
        shell: bash
        run: bash packages/desktop/scripts/verify-macos-package.sh "${{ matrix.arch }}"
      - name: Upload macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: omp-ui-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            packages/desktop/dist/*-mac-preview-${{ matrix.arch }}.dmg
            packages/desktop/dist/*-mac-preview-${{ matrix.arch }}.zip
            packages/desktop/dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
