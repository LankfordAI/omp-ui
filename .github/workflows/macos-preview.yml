name: macOS Preview

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: >-
          Notarize with Apple. Set false during a Notary Service outage
          (issue #124) to still get a signed, non-notarized artifact.
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: verify
    uses: ./.github/workflows/macos-package.yml
    with:
      version: 0.0.0-preview.${{ github.run_number }}
      notarize: ${{ inputs.notarize == 'true' }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged macOS preview
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: packages/desktop/dist
      - name: Upload macOS preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omp-ui-macos-${{ matrix.arch }}-${{ github.sha }}-${{ inputs.notarize == 'true' && 'notarized' || 'signed-only' }}
          path: |
            packages/desktop/dist/*-mac-${{ matrix.arch }}.dmg
            packages/desktop/dist/*-mac-${{ matrix.arch }}.zip
            packages/desktop/dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
