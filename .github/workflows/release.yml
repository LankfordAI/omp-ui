name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: [self-hosted, gfx1201]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stamp version from tag
        # Tolerate the version being stamped on main before tagging (issue
        # 85): `npm version` exits 1 ("Version not changed") when the tree
        # already matches the tag, so only stamp on a real mismatch.
        # Run from the root with --workspace (issue #90): inside the
        # workspace dir `npm version` stamps only that package.json and the
        # root lockfile's workspace entry drifts a version behind.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          current="$(node -p 'require("./packages/desktop/package.json").version')"
          if [ "$current" = "$tag" ]; then
            echo "package.json already at $current — nothing to stamp"
          else
            npm version "$tag" --no-git-tag-version --workspace @omp-ui/desktop
          fi
      - name: Build Linux package
        run: npm run package:linux --workspace @omp-ui/desktop -- --publish never
      - name: Assert Linux artifact and update metadata exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages/desktop/dist
          appimages=(*.AppImage)
          if (( ${#appimages[@]} != 1 )); then
            printf 'Expected exactly one AppImage, found %s\n' "${#appimages[@]}" >&2
            exit 1
          fi
          test -f latest-linux.yml
          grep -q "sha512" latest-linux.yml
          grep -Fq "${appimages[0]}" latest-linux.yml
      - name: Create draft GitHub release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The release stays a draft until release-manifest publishes it.
          # /releases/latest and the releases Atom feed exclude drafts, so while
          # this build is in flight the updater and install.sh keep resolving
          # the last COMPLETED release instead of 404ing on this release's
          # not-yet-uploaded feed files (issue #265).
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "${GITHUB_REF_NAME#v}" --notes "" \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
      - name: Upload Linux assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages/desktop/dist
          appimages=(*.AppImage)
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${appimages[0]}" \
            latest-linux.yml

  package-macos:
    needs: release-linux
    uses: ./.github/workflows/macos-package.yml
    with:
      version: ${{ github.ref_name }}
      notarize: true
      targets: >-
        {"include":[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]}
    secrets: inherit

  release-macos:
    needs: package-macos
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-macos.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged macOS release
        uses: actions/download-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: packages/desktop/dist
      - name: Upload macOS assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dist="packages/desktop/dist"
          dmgs=("$dist"/*-mac-preview-${{ matrix.arch }}.dmg)
          zips=("$dist"/*-mac-preview-${{ matrix.arch }}.zip)
          (( ${#dmgs[@]} == 1 ))
          (( ${#zips[@]} == 1 ))
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${dmgs[0]}" \
            "${zips[0]}" \
            "$dist/SHA256SUMS-macos-${{ matrix.arch }}.txt"

  release-windows:
    needs: release-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Windows core tests
        run: npm test --workspace @omp-ui/core -- --testTimeout=15000
      - name: Run Windows desktop tests
        run: npm test --workspace @omp-ui/desktop
      - name: Stamp version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $current = node -p 'require("./packages/desktop/package.json").version'
          if ($current -eq $tag) {
            Write-Host "package.json already at $current — nothing to stamp"
          } else {
            npm version $tag --no-git-tag-version --workspace @omp-ui/desktop
          }
      - name: Ensure Spectre-mitigated MSVC libraries
        shell: pwsh
        run: |
          $component = "Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64.Spectre"
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          $withSpectre = & $vswhere -latest -products * -requires $component -property installationPath
          if (-not $withSpectre) {
            $setup = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
            $args = "modify --installPath `"$installPath`" --add $component --quiet --norestart"
            $process = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Visual Studio setup exited $($process.ExitCode)" }
          }
          if (-not (& $vswhere -latest -products * -requires $component -property installationPath)) {
            throw "Required Spectre-mitigated MSVC libraries are unavailable"
          }
      - name: Rebuild node-pty for Electron x64
        run: npm run rebuild:native --workspace @omp-ui/desktop -- --arch=x64
      - name: Build unsigned Windows preview
        run: npm run package:win --workspace @omp-ui/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows package
        shell: pwsh
        run: ./packages/desktop/scripts/verify-windows-package.ps1
      - name: Assert Windows artifacts and update metadata exist
        shell: pwsh
        run: |
          $dist = "packages/desktop/dist"
          $installers = @(Get-ChildItem $dist -File -Filter "*-windows-preview-x64-setup.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)" }
          $blockmaps = @(Get-ChildItem $dist -File -Filter "*-windows-preview-x64-setup.exe.blockmap")
          if ($blockmaps.Count -ne 1) { throw "Expected exactly one matching blockmap, found $($blockmaps.Count)" }
          if ($blockmaps[0].Name -ne "$($installers[0].Name).blockmap") { throw "Blockmap does not match installer" }
          $latest = Join-Path $dist "latest.yml"
          if (-not (Test-Path $latest)) { throw "latest.yml is missing" }
          if (-not (Select-String -Path $latest -Pattern "sha512" -Quiet)) { throw "latest.yml has no sha512" }
          if (-not (Select-String -Path $latest -Pattern $installers[0].Name -SimpleMatch -Quiet)) { throw "latest.yml does not name the installer" }
      - name: Upload Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages/desktop/dist
          installers=(*-windows-preview-x64-setup.exe)
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${installers[0]}" \
            "${installers[0]}.blockmap" \
            latest.yml

  release-manifest:
    needs: [release-linux, package-macos, release-macos, release-windows]
    if: ${{ !cancelled() && needs.release-linux.result == 'success' && needs.package-macos.result == 'success' && needs.release-macos.result == 'success' && needs.release-windows.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*.AppImage'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-mac-preview-*.dmg'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-mac-preview-*.zip'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-windows-preview-x64-setup.exe'
      - name: Plan release artifacts and generate metadata
        shell: bash
        env:
          MACOS_TARGETS: ${{ needs.package-macos.outputs.targets }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          macos_arches="$(node -e 'process.stdout.write(JSON.parse(process.env.MACOS_TARGETS).include.map(({arch}) => arch).join(","))')"
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform linux --version "$version" --arches x64 \
            --out-dir release-manifest/linux
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform mac --version "$version" --arches "$macos_arches" \
            --out-dir release-manifest/mac
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform win --version "$version" --arches x64 \
            --out-dir release-manifest/win
      - name: Generate and upload canonical metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat release-manifest/*/checksum-inputs.txt | sort -u > release-assets/checksum-inputs.txt
          cd release-assets
          while IFS= read -r file; do
            sha256sum "$file"
          done < checksum-inputs.txt > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" --clobber \
            SHA256SUMS.txt \
            ../release-manifest/mac/latest-mac.yml
      - name: Assert release metadata and asset boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir release-metadata
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest-linux.yml'
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest.yml'
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest-mac.yml'
          appimage="$(basename release-assets/*.AppImage)"
          grep -q "sha512" release-metadata/latest-linux.yml
          grep -Fq "$appimage" release-metadata/latest-linux.yml
          installer="$(basename release-assets/*-windows-preview-x64-setup.exe)"
          grep -q "sha512" release-metadata/latest.yml
          grep -Fq "$installer" release-metadata/latest.yml
          grep -q "sha512" release-metadata/latest-mac.yml
          grep -q "^version: ${ver}$" release-metadata/latest-mac.yml
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Reached only when all three platform jobs succeeded (job-level
          # if:) and the boundary check above passed — the "complete and
          # ready" gate that makes the release visible to /releases/latest.
          gh release edit "$GITHUB_REF_NAME" --draft=false
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "release $GITHUB_REF_NAME is still a draft" >&2
            exit 1
          fi
