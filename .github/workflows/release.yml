name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, gfx1201]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stamp version from tag
        # Tolerate the version being stamped on main before tagging (issue
        # 85): `npm version` exits 1 ("Version not changed") when the tree
        # already matches the tag, so only stamp on a real mismatch.
        # Run from the root with --workspace (issue #90): inside the
        # workspace dir `npm version` stamps only that package.json and the
        # root lockfile's workspace entry drifts a version behind.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          current="$(node -p 'require("./packages/desktop/package.json").version')"
          if [ "$current" = "$tag" ]; then
            echo "package.json already at $current — nothing to stamp"
          else
            npm version "$tag" --no-git-tag-version --workspace @omp-ui/desktop
          fi
      - name: Build and publish packages
        run: npm run package --workspace @omp-ui/desktop -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/desktop/dist
          sha256sum *.AppImage > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt
      - name: Assert artifacts and update metadata exist
        run: |
          cd packages/desktop/dist
          ls -l
          test -n "$(ls *.AppImage)"
          # AppImage self-update metadata (electron-updater) + the checksums
          # install.sh and manual downloads verify against.
          test -f latest-linux.yml && grep -q "sha512" latest-linux.yml && grep -q "\.AppImage" latest-linux.yml
          test -f SHA256SUMS.txt && test "$(wc -l < SHA256SUMS.txt)" -ge 1
