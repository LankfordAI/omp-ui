name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # The notes generator's job asks for issues/pull-requests read at job level.
  # A called reusable workflow cannot widen the caller's token, so the scopes it
  # needs must be granted here or the whole run fails at startup (issue #377).
  contents: write
  issues: read
  pull-requests: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create draft GitHub release if missing
        shell: bash
        run: |
          set -euo pipefail
          # The release stays a draft until release-manifest publishes it.
          # /releases/latest and the releases Atom feed exclude drafts, so while
          # this build is in flight the updater and install.sh keep resolving
          # the last COMPLETED release instead of 404ing on this release's
          # not-yet-uploaded feed files (issue #265). Every platform lane
          # uploads into this draft, so it exists before any of them start
          # (issue #486).
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "${GITHUB_REF_NAME#v}" --notes "" \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi

  release-linux:
    needs: prepare
    runs-on: [self-hosted, gfx1201]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke-test node-pty under Electron
        run: npm run smoke:pty --workspace @omp-ui/desktop
      - name: Stamp version from tag
        # Tolerate the version being stamped on main before tagging (issue
        # 85): `npm version` exits 1 ("Version not changed") when the tree
        # already matches the tag, so only stamp on a real mismatch.
        # Run from the root with --workspace (issue #90): inside the
        # workspace dir `npm version` stamps only that package.json and the
        # root lockfile's workspace entry drifts a version behind.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          current="$(node -p 'require("./packages/desktop/package.json").version')"
          if [ "$current" = "$tag" ]; then
            echo "package.json already at $current — nothing to stamp"
          else
            npm version "$tag" --no-git-tag-version --workspace @omp-ui/desktop
          fi
      - name: Build Linux package
        run: npm run package:linux --workspace @omp-ui/desktop -- --publish never
      - name: Assert Linux artifact and update metadata exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages/desktop/dist
          appimages=(*.AppImage)
          if (( ${#appimages[@]} != 1 )); then
            printf 'Expected exactly one AppImage, found %s\n' "${#appimages[@]}" >&2
            exit 1
          fi
          test -f latest-linux.yml
          grep -q "sha512" latest-linux.yml
          grep -Fq "${appimages[0]}" latest-linux.yml
      - name: Upload Linux assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages/desktop/dist
          appimages=(*.AppImage)
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${appimages[0]}" \
            latest-linux.yml
      # Lite fleet member (issue #1010): SEA single-file binary + the adjacent
      # node_modules payload node-pty cannot live inside a SEA. Asset names
      # are load-bearing: packaging/install.sh downloads exactly these and its
      # comment says both sides change together. They stay OUT of
      # scripts/release-artifacts.mjs's canonical manifest — the .sha256 asset
      # is their checksum.
      - name: Build host-lite session bundle and SEA binary
        env:
          HOST_LITE_VERSION: ${{ github.ref_name }}
        run: |
          export HOST_LITE_VERSION="${HOST_LITE_VERSION#v}"
          npm run bundle -w @omp-ui/host-lite
          npm run sea -w @omp-ui/host-lite
      - name: Stage and upload host-lite assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST_LITE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${HOST_LITE_VERSION#v}"
          stage="$(mktemp -d)"
          install -d "$stage/node_modules"
          # node-pty plus the bundle's runtime externals (bundle-session.mjs):
          # ws and js-yaml stay external, and argparse rides js-yaml. Ship
          # package.json and session-bundle.mjs right beside node_modules/ so
          # install.sh unpacks all of them into ~/.local/lib/omp-ui-lite/.
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ name: "@omp-ui/host-lite", version: process.argv[2], private: true, type: "module" }, null, 2) + "\n");' "$stage/package.json" "$version"
          cp packages/host-lite/dist/session-bundle.mjs "$stage/session-bundle.mjs"
          cp -R node_modules/node-pty node_modules/ws node_modules/js-yaml node_modules/argparse "$stage/node_modules/"
          tar -czf host-lite-node-pty-linux-x64.tgz -C "$stage" package.json session-bundle.mjs node_modules
          tar -tzf host-lite-node-pty-linux-x64.tgz | grep -qx "package.json"
          [ "$(tar -xOzf host-lite-node-pty-linux-x64.tgz package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = "$version" ]
          cp packages/host-lite/dist-sea/omp-ui-lite omp-ui-lite-linux-x64
          sha256sum omp-ui-lite-linux-x64 > omp-ui-lite-linux-x64.sha256
          gh release upload "$GITHUB_REF_NAME" --clobber \
            omp-ui-lite-linux-x64 \
            omp-ui-lite-linux-x64.sha256 \
            host-lite-node-pty-linux-x64.tgz

  release-container:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Compute release container version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build candidate Host Lite container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/host-lite/Dockerfile
          platforms: linux/amd64
          load: true
          tags: omp-ui-lite:candidate
          build-args: |
            HOST_LITE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-to: type=local,dest=/tmp/buildx-cache,mode=max
      - name: Smoke-test candidate Host Lite container image
        run: node packages/host-lite/scripts/smoke-container.mjs omp-ui-lite:candidate "${{ steps.meta.outputs.version }}"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified Host Lite container image to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/host-lite/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/lankfordai/omp-ui-lite:${{ github.ref_name }}
            ghcr.io/lankfordai/omp-ui-lite:${{ steps.meta.outputs.version }}
            ghcr.io/lankfordai/omp-ui-lite:latest
          build-args: |
            HOST_LITE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=local,src=/tmp/buildx-cache
  release-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-disabled: true
      - name: Verify gradle wrapper jar
        run: |
          expected="$(cat android/gradle/wrapper/gradle-wrapper.jar.sha256)"
          echo "$expected  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Install pinned Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Check Android release verification boundaries
        run: node --test android/scripts/verify-release.test.mjs
      - name: Build and verify signed Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/omp-ui-android.p12
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing Android release keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing Android release keystore password}"
          : "${ANDROID_SIGNING_CERT_SHA256:?Missing pinned Android signing certificate}"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          version="${GITHUB_REF_NAME#v}"
          ./android/gradlew -p android --no-daemon --no-configuration-cache \
            -PreleaseVersion="$version" :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
          node android/scripts/verify-release.mjs \
            android/app/build/outputs/apk/release/app-release.apk "$version" "$ANDROID_SIGNING_CERT_SHA256"
          mkdir release-android
          cp android/app/build/outputs/apk/release/app-release.apk "release-android/omp-ui-${version}-android.apk"
      - name: Upload Android APK into the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "release-android/omp-ui-${GITHUB_REF_NAME#v}-android.apk"

  release-notes:
    needs: prepare
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ github.ref_name }}
      force: false

  package-macos:
    needs: prepare
    uses: ./.github/workflows/macos-package.yml
    with:
      version: ${{ github.ref_name }}
      notarize: true
      release_tag: ${{ github.ref_name }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  test-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Windows core tests
        run: npm test --workspace @omp-ui/core -- --testTimeout=15000
      - name: Run Windows desktop tests
        run: npm test --workspace @omp-ui/desktop

  release-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke-test node-pty under Electron
        # node-pty's win32-x64 Node-API prebuild ships unrebuilt (no MSVC
        # toolchain on this lane; issue #484); this proves it loads inside
        # Electron.
        run: npm run smoke:pty --workspace @omp-ui/desktop
      - name: Stamp version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $current = node -p 'require("./packages/desktop/package.json").version'
          if ($current -eq $tag) {
            Write-Host "package.json already at $current — nothing to stamp"
          } else {
            npm version $tag --no-git-tag-version --workspace @omp-ui/desktop
          }
      - name: Build unsigned Windows preview
        run: npm run package:win --workspace @omp-ui/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows package
        shell: pwsh
        run: ./packages/desktop/scripts/verify-windows-package.ps1
      - name: Assert Windows artifacts and update metadata exist
        shell: pwsh
        run: |
          $dist = "packages/desktop/dist"
          $installers = @(Get-ChildItem $dist -File -Filter "*-windows-preview-x64-setup.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)" }
          $blockmaps = @(Get-ChildItem $dist -File -Filter "*-windows-preview-x64-setup.exe.blockmap")
          if ($blockmaps.Count -ne 1) { throw "Expected exactly one matching blockmap, found $($blockmaps.Count)" }
          if ($blockmaps[0].Name -ne "$($installers[0].Name).blockmap") { throw "Blockmap does not match installer" }
          $latest = Join-Path $dist "latest.yml"
          if (-not (Test-Path $latest)) { throw "latest.yml is missing" }
          if (-not (Select-String -Path $latest -Pattern "sha512" -Quiet)) { throw "latest.yml has no sha512" }
          if (-not (Select-String -Path $latest -Pattern $installers[0].Name -SimpleMatch -Quiet)) { throw "latest.yml does not name the installer" }
      - name: Upload Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages/desktop/dist
          installers=(*-windows-preview-x64-setup.exe)
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${installers[0]}" \
            "${installers[0]}.blockmap" \
            latest.yml

  release-manifest:
    needs: [release-linux, release-container, package-macos, release-windows, release-android, test-windows, release-notes]
    if: ${{ !cancelled() && needs.release-linux.result == 'success' && needs.release-container.result == 'success' && needs.package-macos.result == 'success' && needs.release-windows.result == 'success' && needs.release-android.result == 'success' && needs.test-windows.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*.AppImage'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-mac-*.dmg'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-mac-*.zip'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-windows-preview-x64-setup.exe'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-android.apk'
      - name: Plan release artifacts and generate metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform linux --version "$version" --arches x64 \
            --out-dir release-manifest/linux
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform mac --version "$version" --arches arm64 \
            --out-dir release-manifest/mac
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform win --version "$version" --arches x64 \
            --out-dir release-manifest/win
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform android --version "$version" --arches universal \
            --out-dir release-manifest/android
      - name: Generate and upload canonical metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat release-manifest/*/checksum-inputs.txt | sort -u > release-assets/checksum-inputs.txt
          cd release-assets
          while IFS= read -r file; do
            sha256sum "$file"
          done < checksum-inputs.txt > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" --clobber \
            SHA256SUMS.txt \
            ../release-manifest/mac/latest-mac.yml
      - name: Assert release metadata and asset boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir release-metadata
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest-linux.yml'
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest.yml'
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest-mac.yml'
          appimage="$(basename release-assets/*.AppImage)"
          grep -q "sha512" release-metadata/latest-linux.yml
          grep -Fq "$appimage" release-metadata/latest-linux.yml
          installer="$(basename release-assets/*-windows-preview-x64-setup.exe)"
          grep -q "sha512" release-metadata/latest.yml
          grep -Fq "$installer" release-metadata/latest.yml
          grep -q "sha512" release-metadata/latest-mac.yml
          grep -q "^version: ${ver}$" release-metadata/latest-mac.yml
      - name: Warn when release notes are missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          length="$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body | length')"
          if [ "$length" = "0" ]; then
            echo "::warning::release $GITHUB_REF_NAME is being published with no notes (release-notes job failed or produced nothing)"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Reached only when all four platform jobs succeeded (job-level
          # if:) and the boundary check above passed — the "complete and
          # ready" gate that makes the release visible to /releases/latest.
          gh release edit "$GITHUB_REF_NAME" --draft=false
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "release $GITHUB_REF_NAME is still a draft" >&2
            exit 1
          fi
