name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: gfx-1201
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stamp version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: packages/desktop
      - name: Build and publish packages
        run: npm run package --workspace @omp-ui/desktop -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert all four artifacts exist
        run: |
          cd packages/desktop/dist
          ls -l
          test -n "$(ls *.AppImage)" && test -n "$(ls *.deb)" && test -n "$(ls *.rpm)" && test -n "$(ls *.flatpak)"
