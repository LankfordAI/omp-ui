name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, gfx1201]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak dbus appstream
          # flatpak's parental-controls check for app refs queries the system
          # bus; the containerized runner has none, so start one and install
          # system-scope (missing malcontent service then reads as disabled).
          sudo mkdir -p /run/dbus
          sudo dbus-daemon --system --fork || true
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stamp version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: packages/desktop
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net packages/desktop/build/ai.lankford.omp-ui.metainfo.xml
      - name: Build and publish packages
        run: npm run package --workspace @omp-ui/desktop -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and upload Flatpak bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./packaging/flatpak/assemble.sh \
            packages/desktop/dist/linux-unpacked \
            "packages/desktop/dist/omp-ui-${version}-x86_64.flatpak"
          gh release upload "$GITHUB_REF_NAME" \
            "packages/desktop/dist/omp-ui-${version}-x86_64.flatpak"
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/desktop/dist
          sha256sum *.AppImage *.deb *.rpm *.flatpak > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt
      - name: Assert artifacts and update metadata exist
        run: |
          cd packages/desktop/dist
          ls -l
          test -n "$(ls *.AppImage)" && test -n "$(ls *.deb)" && test -n "$(ls *.rpm)" && test -n "$(ls *.flatpak)"
          # AppImage self-update metadata (electron-updater) + the checksums
          # the deb/rpm/Flatpak download path verifies against.
          test -f latest-linux.yml && grep -q "sha512" latest-linux.yml && grep -q "\.AppImage" latest-linux.yml
          test -f SHA256SUMS.txt && test "$(wc -l < SHA256SUMS.txt)" -ge 4
          # AppStream metainfo and license metadata inside the built packages (#58)
          rpm -qpl ./*.rpm | grep -q "usr/share/metainfo/ai.lankford.omp-ui.metainfo.xml"
          rpm -qip ./*.rpm | grep -qE "License\s*:\s*MIT"
          dpkg-deb -c ./*.deb | grep -q "usr/share/metainfo/ai.lankford.omp-ui.metainfo.xml"
