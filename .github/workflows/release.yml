name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # The notes generator's job asks for issues/pull-requests read at job level.
  # A called reusable workflow cannot widen the caller's token, so the scopes it
  # needs must be granted here or the whole run fails at startup (issue #377).
  contents: write
  issues: read
  pull-requests: read

jobs:
  # Every lane packages the persistent host first (issue #442 §10.1): the
  # desktop client embeds the lane's unpacked host layout as its cold-start
  # seed, so `package:host` and `smoke:package` run before electron-builder.
  # `smoke:package --record` writes the package evidence record that
  # release-manifest consumes before publishing (§12).
  release-linux:
    runs-on: [self-hosted, gfx1201]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stamp version from tag
        # Tolerate the version being stamped on main before tagging (issue
        # 85): `npm version` exits 1 ("Version not changed") when the tree
        # already matches the tag, so only stamp on a real mismatch.
        # Run from the root with --workspace (issue #90): inside the
        # workspace dir `npm version` stamps only that package.json and the
        # root lockfile's workspace entry drifts a version behind.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          current="$(node -p 'require("./packages/desktop/package.json").version')"
          if [ "$current" = "$tag" ]; then
            echo "package.json already at $current — nothing to stamp"
          else
            npm version "$tag" --no-git-tag-version --workspace @omp-ui/desktop
          fi
      - name: Fetch the pinned verifier browser
        run: npm run fetch:verifier-browser --workspace @omp-ui/host
      - name: Build plan-doc, host verifier page, and desktop bundles
        run: npm run build
      - name: Package and smoke-test the Linux host
        run: |
          set -euo pipefail
          npm run package:host --workspace @omp-ui/host -- --lane linux-x64
          npm run smoke:package --workspace @omp-ui/host -- --lane linux-x64 \
            --record "$PWD/package-records/package-record-linux-x64.json" --release-tag "$GITHUB_REF_NAME"
      - name: Build Linux package
        # electron-builder directly: `npm run build` above already produced the
        # bundles the `package:linux` script would rebuild.
        run: npm exec --workspace @omp-ui/desktop -- electron-builder --linux --publish never
      - name: Assert Linux artifacts and update metadata exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          cd packages/desktop/dist
          appimages=(*.AppImage)
          if (( ${#appimages[@]} != 1 )); then
            printf 'Expected exactly one AppImage, found %s\n' "${#appimages[@]}" >&2
            exit 1
          fi
          test -f latest-linux.yml
          grep -q "sha512" latest-linux.yml
          grep -Fq "${appimages[0]}" latest-linux.yml
          cd ../../host/out/linux-x64
          test -f "omp-ui-host-${version}-linux-x64.tar.gz"
          test -f latest-host-linux.yml
          grep -q "^version: ${version}$" latest-host-linux.yml
          grep -Fq "omp-ui-host-${version}-linux-x64.tar.gz" latest-host-linux.yml
      - name: Stage Linux package evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-record-linux-x64
          path: package-records/
          if-no-files-found: error
          retention-days: 1
      - name: Create draft GitHub release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The release stays a draft until release-manifest publishes it.
          # /releases/latest and the releases Atom feed exclude drafts, so while
          # this build is in flight the updaters and install.sh keep resolving
          # the last COMPLETED release instead of 404ing on this release's
          # not-yet-uploaded feed files (issue #265).
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "${GITHUB_REF_NAME#v}" --notes "" \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
      - name: Upload Linux assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          appimages=(packages/desktop/dist/*.AppImage)
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${appimages[0]}" \
            packages/desktop/dist/latest-linux.yml \
            "packages/host/out/linux-x64/omp-ui-host-${version}-linux-x64.tar.gz" \
            packages/host/out/linux-x64/latest-host-linux.yml

  # The no-display gate (issues #442 and #463): the host's live tests and the
  # packaged smoke run with no graphical environment, as the lingering user
  # service does. A skipped live test is a failure here — a missing binary that
  # named-skips in development must not skip release evidence.
  no-display-gate:
    runs-on: [self-hosted, gfx1201]
    # OMP_UI_DATA_DIR is exported by the first step: `runner.temp` is not
    # available in job-level env, and nothing here may touch the runner
    # user's real data root.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolate the data root
        shell: bash
        run: |
          set -euo pipefail
          echo "OMP_UI_DATA_DIR=$RUNNER_TEMP/omp-ui-gate-data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/omp-ui-gate-data" package-records/gate
      - name: Stamp version from tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          current="$(node -p 'require("./packages/desktop/package.json").version')"
          if [ "$current" != "$tag" ]; then
            npm version "$tag" --no-git-tag-version --workspace @omp-ui/desktop
          fi
      - name: Fetch the pinned verifier browser
        run: npm run fetch:verifier-browser --workspace @omp-ui/host
      - run: npm run build
      - name: Run host live tests with no display
        shell: bash
        run: |
          set -euo pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY \
            npm run test:live --workspace @omp-ui/host -- \
              --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/host-live.json"
      - name: Package and smoke-test the host with no display
        shell: bash
        run: |
          set -euo pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY \
            npm run package:host --workspace @omp-ui/host -- --lane linux-x64
          env -u DISPLAY -u WAYLAND_DISPLAY \
            npm run smoke:package --workspace @omp-ui/host -- --lane linux-x64 \
              --record "$PWD/package-records/gate/package-record-linux-x64.json" --release-tag "$GITHUB_REF_NAME"
      - name: Write the gate record
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          env -u DISPLAY -u WAYLAND_DISPLAY node - "$RUNNER_TEMP/host-live.json" "$ID" "$VERSION_ID" <<'EOF'
          const fs = require("node:fs");
          const [file, osId, osVersionId] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(file, "utf8"));
          const tests = report.testResults.flatMap((suite) => suite.assertionResults);
          const count = (...statuses) => tests.filter(({ status }) => statuses.includes(status)).length;
          const liveTests = {
            total: tests.length,
            passed: count("passed"),
            failed: count("failed"),
            skipped: count("skipped", "pending", "todo", "disabled"),
          };
          for (const test of tests) {
            if (test.status !== "passed") console.error(`${test.status}: ${test.fullName}`);
          }
          const record = {
            schemaVersion: 1,
            kind: "no-display-gate",
            releaseTag: process.env.GITHUB_REF_NAME,
            platform: "linux",
            arch: "x64",
            os: { id: osId, versionId: osVersionId },
            display: { DISPLAY: process.env.DISPLAY ?? null, WAYLAND_DISPLAY: process.env.WAYLAND_DISPLAY ?? null },
            liveTests,
            smokeRecord: "gate/package-record-linux-x64.json",
            runner: process.env.RUNNER_NAME ?? null,
            finishedAt: new Date().toISOString(),
          };
          fs.writeFileSync("package-records/no-display-gate.json", `${JSON.stringify(record, null, 2)}\n`);
          console.log(JSON.stringify(liveTests));
          if (liveTests.total === 0 || liveTests.failed > 0 || liveTests.skipped > 0) {
            console.error("the no-display gate requires every host live test to run and pass");
            process.exit(1);
          }
          EOF
      - name: Stage gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-record-no-display-gate
          path: package-records/
          if-no-files-found: error
          retention-days: 1

  release-notes:
    needs: release-linux
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ github.ref_name }}
      force: false
    secrets: inherit

  package-macos:
    needs: release-linux
    uses: ./.github/workflows/macos-package.yml
    with:
      version: ${{ github.ref_name }}
      notarize: true
      targets: >-
        {"include":[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]}
    secrets: inherit

  release-macos:
    needs: package-macos
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-macos.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download packaged macOS release
        uses: actions/download-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: packages
      - name: Upload macOS assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          dist="packages/desktop/dist"
          dmgs=("$dist"/*-mac-preview-${{ matrix.arch }}.dmg)
          zips=("$dist"/*-mac-preview-${{ matrix.arch }}.zip)
          (( ${#dmgs[@]} == 1 ))
          (( ${#zips[@]} == 1 ))
          host="packages/host/out/mac-${{ matrix.arch }}/omp-ui-host-${version}-mac-${{ matrix.arch }}.zip"
          test -f "$host"
          # latest-host-mac.yml lists both arches, so release-manifest composes it.
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${dmgs[0]}" \
            "${zips[0]}" \
            "$dist/SHA256SUMS-macos-${{ matrix.arch }}.txt" \
            "$host"

  release-windows:
    needs: release-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Windows core tests
        run: npm test --workspace @omp-ui/core -- --testTimeout=15000
      - name: Run Windows desktop tests
        run: npm test --workspace @omp-ui/desktop
      - name: Stamp version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $current = node -p 'require("./packages/desktop/package.json").version'
          if ($current -eq $tag) {
            Write-Host "package.json already at $current — nothing to stamp"
          } else {
            npm version $tag --no-git-tag-version --workspace @omp-ui/desktop
          }
      - name: Ensure Spectre-mitigated MSVC libraries
        # node-pty's binding.gyp requires them; the host lane compiles it for
        # the pinned Node ABI.
        shell: pwsh
        run: |
          $component = "Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64.Spectre"
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          $withSpectre = & $vswhere -latest -products * -requires $component -property installationPath
          if (-not $withSpectre) {
            $setup = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
            $args = "modify --installPath `"$installPath`" --add $component --quiet --norestart"
            $process = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Visual Studio setup exited $($process.ExitCode)" }
          }
          if (-not (& $vswhere -latest -products * -requires $component -property installationPath)) {
            throw "Required Spectre-mitigated MSVC libraries are unavailable"
          }
      - name: Fetch the pinned verifier browser
        run: npm run fetch:verifier-browser --workspace @omp-ui/host
      - name: Build plan-doc, host verifier page, and desktop bundles
        run: npm run build
      - name: Package and smoke-test the Windows host
        shell: bash
        run: |
          set -euo pipefail
          npm run package:host --workspace @omp-ui/host -- --lane win-x64
          npm run smoke:package --workspace @omp-ui/host -- --lane win-x64 \
            --record "$PWD/package-records/package-record-win-x64.json" --release-tag "$GITHUB_REF_NAME"
      - name: Build unsigned Windows preview
        run: npm exec --workspace @omp-ui/desktop -- electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows package
        shell: pwsh
        run: ./packages/desktop/scripts/verify-windows-package.ps1
      - name: Assert Windows artifacts and update metadata exist
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $dist = "packages/desktop/dist"
          $installers = @(Get-ChildItem $dist -File -Filter "*-windows-preview-x64-setup.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)" }
          $blockmaps = @(Get-ChildItem $dist -File -Filter "*-windows-preview-x64-setup.exe.blockmap")
          if ($blockmaps.Count -ne 1) { throw "Expected exactly one matching blockmap, found $($blockmaps.Count)" }
          if ($blockmaps[0].Name -ne "$($installers[0].Name).blockmap") { throw "Blockmap does not match installer" }
          $latest = Join-Path $dist "latest.yml"
          if (-not (Test-Path $latest)) { throw "latest.yml is missing" }
          if (-not (Select-String -Path $latest -Pattern "sha512" -Quiet)) { throw "latest.yml has no sha512" }
          if (-not (Select-String -Path $latest -Pattern $installers[0].Name -SimpleMatch -Quiet)) { throw "latest.yml does not name the installer" }
          $hostOut = "packages/host/out/win-x64"
          $hostZip = "omp-ui-host-$version-win-x64.zip"
          if (-not (Test-Path (Join-Path $hostOut $hostZip))) { throw "$hostZip is missing" }
          $hostFeed = Join-Path $hostOut "latest-host-win.yml"
          if (-not (Test-Path $hostFeed)) { throw "latest-host-win.yml is missing" }
          if (-not (Select-String -Path $hostFeed -Pattern "^version: $([regex]::Escape($version))$" -Quiet)) { throw "latest-host-win.yml does not carry version $version" }
          if (-not (Select-String -Path $hostFeed -Pattern $hostZip -SimpleMatch -Quiet)) { throw "latest-host-win.yml does not name $hostZip" }
      - name: Stage Windows package evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-record-win-x64
          path: package-records/
          if-no-files-found: error
          retention-days: 1
      - name: Upload Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          installers=(packages/desktop/dist/*-windows-preview-x64-setup.exe)
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${installers[0]}" \
            "${installers[0]}.blockmap" \
            packages/desktop/dist/latest.yml \
            "packages/host/out/win-x64/omp-ui-host-${version}-win-x64.zip" \
            packages/host/out/win-x64/latest-host-win.yml

  release-manifest:
    needs: [release-linux, no-display-gate, package-macos, release-macos, release-windows, release-notes]
    if: ${{ !cancelled() && needs.release-linux.result == 'success' && needs.no-display-gate.result == 'success' && needs.package-macos.result == 'success' && needs.release-macos.result == 'success' && needs.release-windows.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*.AppImage'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-mac-preview-*.dmg'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-mac-preview-*.zip'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern '*-windows-preview-x64-setup.exe'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern 'omp-ui-host-*'
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern 'latest-host-*.yml'
      - name: Download package evidence
        uses: actions/download-artifact@v4
        with:
          pattern: package-record-*
          merge-multiple: true
          path: package-records
      - name: Compose the macOS host feed
        # The two macOS lanes build on separate runners; the one feed listing
        # both arches is rendered here from the uploaded archives.
        run: |
          set -euo pipefail
          node scripts/host-feed.mjs --dir release-assets --platform mac --version "${GITHUB_REF_NAME#v}" \
            --out release-assets/latest-host-mac.yml
      - name: Plan release artifacts, consume evidence, and generate metadata
        shell: bash
        env:
          MACOS_TARGETS: ${{ needs.package-macos.outputs.targets }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          macos_arches="$(node -e 'process.stdout.write(JSON.parse(process.env.MACOS_TARGETS).include.map(({arch}) => arch).join(","))')"
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform linux --version "$version" --arches x64 \
            --records package-records --out-dir release-manifest/linux
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform mac --version "$version" --arches "$macos_arches" \
            --records package-records --out-dir release-manifest/mac
          node scripts/release-artifacts.mjs \
            --dir release-assets --platform win --version "$version" --arches x64 \
            --records package-records --out-dir release-manifest/win
      - name: Generate and upload canonical metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat release-manifest/*/checksum-inputs.txt | sort -u > release-assets/checksum-inputs.txt
          cd release-assets
          while IFS= read -r file; do
            sha256sum "$file"
          done < checksum-inputs.txt > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" --clobber \
            SHA256SUMS.txt \
            latest-host-mac.yml \
            ../release-manifest/mac/latest-mac.yml
      - name: Assert release metadata and asset boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir release-metadata
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest-linux.yml'
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest.yml'
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest-mac.yml'
          gh release download "$GITHUB_REF_NAME" --dir release-metadata --pattern 'latest-host-*.yml'
          appimage="$(basename release-assets/*.AppImage)"
          grep -q "sha512" release-metadata/latest-linux.yml
          grep -Fq "$appimage" release-metadata/latest-linux.yml
          installer="$(basename release-assets/*-windows-preview-x64-setup.exe)"
          grep -q "sha512" release-metadata/latest.yml
          grep -Fq "$installer" release-metadata/latest.yml
          grep -q "sha512" release-metadata/latest-mac.yml
          grep -q "^version: ${ver}$" release-metadata/latest-mac.yml
          for lane in linux-x64 mac-arm64 mac-x64 win-x64; do
            platform="${lane%%-*}"
            ext=tar.gz
            [ "$platform" = linux ] || ext=zip
            grep -q "^version: ${ver}$" "release-metadata/latest-host-${platform}.yml"
            grep -Fq "url: omp-ui-host-${ver}-${lane}.${ext}" "release-metadata/latest-host-${platform}.yml"
            grep -Fq "omp-ui-host-${ver}-${lane}.${ext}" release-assets/SHA256SUMS.txt
          done
          test "$(wc -l < release-assets/SHA256SUMS.txt)" -eq 10
      - name: Warn when release notes are missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          length="$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body | length')"
          if [ "$length" = "0" ]; then
            echo "::warning::release $GITHUB_REF_NAME is being published with no notes (release-notes job failed or produced nothing)"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Reached only when every lane, the no-display gate, and the evidence
          # check above passed — the "complete and ready" gate that makes the
          # release visible to /releases/latest.
          gh release edit "$GITHUB_REF_NAME" --draft=false
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "release $GITHUB_REF_NAME is still a draft after publish" >&2
            exit 1
          fi
