name: Diag userns

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, gfx1201]
    steps:
      - name: Probe root bwrap path
        run: |
          echo "--- caps"
          grep Cap /proc/self/status
          echo "--- full ns unshare (what bwrap needs, unprivileged)"
          unshare -Urm true && echo "FULL UNSHARE OK" || echo "FULL UNSHARE BLOCKED"
          echo "--- install bubblewrap"
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap flatpak flatpak-builder >/dev/null
          echo "--- bwrap unprivileged"
          bwrap --bind / / true && echo "BWRAP USER OK" || echo "BWRAP USER BLOCKED"
          echo "--- bwrap as root"
          sudo bwrap --bind / / true && echo "BWRAP ROOT OK" || echo "BWRAP ROOT BLOCKED"
          echo "--- root caps"
          sudo grep Cap /proc/self/status
          echo "--- root mount ns"
          sudo unshare -m true && echo "ROOT MNT NS OK" || echo "ROOT MNT NS BLOCKED"
