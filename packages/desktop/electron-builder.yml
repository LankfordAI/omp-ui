appId: ai.lankford.omp-ui
productName: omp-ui
executableName: omp-ui
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: false
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
  synopsis: Desktop GUI for the omp coding agent
  maintainer: Austin Lankford <austin@austinlankford.com>
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: null
  notarize: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
publish:
  provider: github
  owner: LankfordAI
  repo: omp-ui
  releaseType: release
