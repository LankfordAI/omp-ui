appId: ai.lankford.omp-ui
productName: omp-ui
executableName: omp-ui
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: false
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
  synopsis: Desktop GUI for the omp coding agent
  maintainer: Austin Lankford <austin@austinlankford.com>
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: ${productName}-${version}-mac-preview-${arch}.${ext}
  target:
    - dmg
    - zip
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-${version}-windows-preview-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: LankfordAI
  repo: omp-ui
  releaseType: release
