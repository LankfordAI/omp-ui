appId: ai.lankford.omp-ui
productName: omp-ui
executableName: omp-ui
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: false
linux:
  target:
    - AppImage
    - deb
    - rpm
    - flatpak
  category: Development
  synopsis: Desktop GUI for the omp coding agent
  maintainer: Austin Lankford <austin@austinlankford.com>
deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
rpm:
  artifactName: ${productName}-${version}.${arch}.${ext}
flatpak:
  runtime: org.freedesktop.Platform
  sdk: org.freedesktop.Sdk
  runtimeVersion: "24.08"
  base: org.electronjs.Electron2.BaseApp
  baseVersion: "24.08"
  artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: LankfordAI
  repo: omp-ui
  releaseType: release
