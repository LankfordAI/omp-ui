appId: ai.lankford.omp-ui
productName: omp-ui
executableName: omp-ui
directories:
  output: dist
files:
  - out/**
  - package.json
  # node-pty ships every platform's prebuilt addon plus MSVC debug symbols; the
  # platform blocks below keep only what that platform's runtime can load.
  - "!**/node_modules/node-pty/prebuilds/**/*.pdb"
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: false
# node-pty's darwin prebuild stores spawn-helper mode 0644; OR the exec bit
# back in the packed tree before signing (issue #489).
afterPack: ./scripts/ensure-node-pty-exec.cjs
toolsets:
  appimage: "1.0.3"
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
  synopsis: Desktop GUI for the omp coding agent
  maintainer: Austin Lankford <austin@austinlankford.com>
  files:
    # No Linux prebuild exists; npm ci compiles build/Release/pty.node.
    - "!**/node_modules/node-pty/prebuilds{,/**/*}"
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
  files:
    - "!**/node_modules/node-pty/prebuilds/win32-*{,/**/*}"
dmg:
  # The release uploads the DMG, ZIP, and checksums; latest-mac.yml never names
  # a DMG blockmap, so building one is wasted time.
  writeUpdateInfo: false
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-${version}-windows-preview-${arch}-setup.${ext}
  files:
    - "!**/node_modules/node-pty/prebuilds/darwin-*{,/**/*}"
    # package:win builds x64 only.
    - "!**/node_modules/node-pty/prebuilds/win32-arm64{,/**/*}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: LankfordAI
  repo: omp-ui
  releaseType: release
