appId: ai.lankford.omp-ui
productName: omp-ui
executableName: omp-ui
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: false
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  synopsis: Desktop GUI for the omp coding agent
  maintainer: Austin Lankford <austin@austinlankford.com>
deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
rpm:
  artifactName: ${productName}-${version}.${arch}.${ext}
publish:
  provider: github
  owner: LankfordAI
  repo: omp-ui
  releaseType: release
