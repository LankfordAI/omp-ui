appId: ai.lankford.omp-ui
productName: omp-ui
executableName: omp-ui
directories:
  output: dist
files:
  - out/**
  - package.json
# The headless plan verifier (issue #442 §8): the pinned Chrome for Testing that
# `npm run fetch:verifier-browser -w @omp-ui/host` unpacked for this os/arch, and
# the built verifier page (`npm run build -w @omp-ui/host`). Both are resolved
# through process.resourcesPath; nothing is downloaded at runtime.
extraResources:
  - from: "../host/resources/plan-verifier/${os}-${arch}"
    to: plan-verifier
  - from: ../host/dist/verifier
    to: verifier-page
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: false
toolsets:
  appimage: "1.0.3"
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
  synopsis: Desktop GUI for the omp coding agent
  maintainer: Austin Lankford <austin@austinlankford.com>
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: ${productName}-${version}-mac-preview-${arch}.${ext}
  target:
    - dmg
    - zip
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-${version}-windows-preview-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: LankfordAI
  repo: omp-ui
  releaseType: release
