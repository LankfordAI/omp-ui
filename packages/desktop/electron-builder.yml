appId: ai.lankford.omp-ui
productName: omp-ui
executableName: omp-ui
directories:
  output: dist
files:
  - out/**
  - package.json
afterPack: scripts/prepare-macos-verifier.mjs
# The persistent host seed (issue #442 §10.1): the lane's unpacked host layout
# that `npm run package:host -w @omp-ui/host -- --lane ${os}-${arch}` wrote,
# embedded as resources/host/<version>/{bin,lib,resources,service}. The desktop
# client relocates it into <dataHome>/omp-ui-host/versions/ only when no live
# or installed host exists; a desktop update never writes an installed host.
extraResources:
  - from: "../host/out/${os}-${arch}/seed"
    to: host
toolsets:
  appimage: "1.0.3"
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
  synopsis: Desktop GUI for the omp coding agent
  maintainer: Austin Lankford <austin@austinlankford.com>
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # The host verifies the vendored Chrome for Testing against the SHA-256 in
  # its browser.manifest.json before every launch (issue #442 §7); re-signing
  # it here would change those bytes. Google's own signature stays in place.
  signIgnore:
    - "/Resources/host/[^/]+/resources/plan-verifier/"
  artifactName: ${productName}-${version}-mac-preview-${arch}.${ext}
  target:
    - dmg
    - zip
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-${version}-windows-preview-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: LankfordAI
  repo: omp-ui
  releaseType: release
