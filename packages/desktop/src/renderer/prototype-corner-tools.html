<!doctype html>
<!--
═══════════════════════════════════════════════════════════════════════════
 PROTOTYPE — THROWAWAY. NOT PART OF THE APP. DELETE WHEN DONE.
═══════════════════════════════════════════════════════════════════════════

 QUESTION: "What should the corner tools card look like?" — a floating
 project-tools surface in omp-ui's title bar (right end, BEFORE the
 OVERLAY_INSET caption-button spacer). Four structurally different
 variants of the SAME content set, switchable by URL param + bottom bar.

 RUN:  just open the file in a browser — no build, no server:
         xdg-open packages/desktop/src/renderer/prototype-corner-tools.html
       variant via URL:  ...prototype-corner-tools.html?variant=card|fan|chip|dock
       or ← / → arrow keys / the floating bottom bar to cycle.

 CONTENT SET (decided): project identity header (monogram + name + machine
 subline), New session, Open in VS Code / Files / Terminal, separated
 footer Project settings. NO git rows. Gating mirrored: local checkout
 only + non-compact shell; VS Code iff available.vsCode; Files always;
 Terminal iff available.terminal; remote pair focused → only a disabled
 Remote-SSH row with its reason.

 ALL BACKEND CALLS ARE FAKE and logged to the state panel on the left:
 backend.getProjectOpenAvailability() / backend.openProject(path, kind).

 NEUTRAL CHROME ONLY: signal mint is reserved for liveness (ADR-0004);
 the card uses bg-raised / border-line / text-ink-mid / hover:bg-hover
 values copied from theme-default.css.

 This file is a standalone throwaway that fakes the title-bar strip; it
 touches no app code. Colors/heights mimic the real 36px header with its
 132px Linux caption-button inset.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE — corner tools card</title>
<style>
  /* tokens copied from theme-default.css (dark default) */
  :root {
    --void: #0a0b0d; --sunken: #0e1013; --surface: #14171b; --raised: #1a1e23;
    --overlay: #22272e; --hover: #2a3037; --line: #23282f; --line-soft: #1b1f24;
    --line-strong: #333a43; --ink: #e8ecf1; --ink-mid: #a8b2bf; --ink-dim: #6f7b8a;
    --ink-faint: #4a5361; --signal: #4ade9f;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); font-family: var(--sans); font-size: 13px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* Drag polarity, mirroring the real title bar: the strip drags the window,
     every interactive box inside carves itself out with no-drag. */
  .titlebar { -webkit-app-region: drag; }
  .titlebar button, .titlebar .fan, .titlebar .chip, .panel, .dock, .switcher, .state { -webkit-app-region: no-drag; }
  .caption-spacer { -webkit-app-region: drag; }

  .titlebar { position: relative; display: flex; align-items: center; gap: 4px; height: 36px; background: var(--void); border-bottom: 1px solid var(--line); padding-left: 12px; user-select: none; }
  .brand-dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--signal); }
  .brand { font-weight: 600; letter-spacing: -0.01em; padding-right: 8px; }
  .brand span { color: var(--ink-faint); }
  .hud-title { flex: 1; min-width: 0; truncate: ellipsis; overflow: hidden; white-space: nowrap; color: var(--ink-dim); font-size: 12px; padding: 0 8px; }
  .caption-spacer { flex-shrink: 0; height: 100%; width: 132px; background: repeating-linear-gradient(135deg, transparent 0 7px, rgba(255,255,255,.015) 7px 8px); }
  .caption-note { position: absolute; right: 8px; top: 10px; font-size: 9px; color: var(--ink-faint); pointer-events: none; }
  .app-body { display: flex; height: calc(100% - 37px); }
  .fake-sidebar { width: 220px; border-right: 1px solid var(--line); background: var(--sunken); padding: 10px; color: var(--ink-faint); font-size: 11px; }
  .fake-main { flex: 1; display: grid; place-items: center; color: var(--ink-faint); font-size: 12px; }

  /* ── shared bits ────────────────────────────────────────────────── */
  .monogram { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font-weight: 600; font-size: 10px; flex-shrink: 0; }
  .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--ink-mid); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  svg.glyph { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  .menu-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 5px 6px; border-radius: 4px; font-size: 11px; color: var(--ink-mid); }
  .menu-row:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .menu-row:disabled { color: var(--ink-dim); cursor: default; }
  .menu-row .g { display: grid; place-items: center; width: 14px; flex-shrink: 0; }
  .menu-row .hint { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-faint); padding-left: 8px; }
  .sep { height: 1px; background: var(--line); margin: 4px 0; }
  .group-label { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); padding: 6px 6px 2px; }
  /* Portaled to body like the real popover convention; positioned via JS
     from the trigger's getBoundingClientRect() — never left in-flow. */
  .panel { position: fixed; z-index: 40; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: rise .12s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .id-head { display: flex; align-items: center; gap: 8px; padding: 5px 6px; }
  .id-head .who { min-width: 0; }
  .id-head .name { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .id-head .sub { font-size: 10px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .remote-reason { padding: 6px; border-radius: 6px; background: var(--sunken); border: 1px dashed var(--line-strong); color: var(--ink-dim); font-size: 10.5px; line-height: 1.45; }

  /* ── variant B: fan ─────────────────────────────────────────────── */
  .fan { display: flex; align-items: center; height: 100%; }
  .fan .icon-btn { overflow: hidden; transition: width .18s ease, opacity .18s ease, transform .18s ease; }
  /* expanded is JS-class-driven (200ms open delay / 400ms leave grace), not :hover */
  .fan:not(.expanded) .fan-item { width: 0; opacity: 0; transform: translateX(6px); pointer-events: none; }

  /* ── variant C: chip ────────────────────────────────────────────── */
  .chip { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 3px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-mid); font-size: 11px; max-width: 220px; }
  .chip:hover, .chip.active { background: var(--hover); color: var(--ink); border-color: var(--line-strong); }
  .chip .monogram { width: 18px; height: 18px; border-radius: 5px; font-size: 8px; }
  .chip .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── variant D: docked mini card ────────────────────────────────── */
  .dock { position: absolute; top: 41px; right: 140px; z-index: 30; width: 230px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  .dock .row1 { display: flex; align-items: center; gap: 7px; }
  .dock .row1 .nm { font-size: 12px; color: var(--ink); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dock .row2 { margin-top: 3px; font-size: 10px; color: var(--ink-dim); padding-left: 31px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  /* ── state panel (the prototype's instrumentation, not design) ──── */
  .state { position: fixed; left: 12px; bottom: 64px; width: 330px; max-height: 46vh; overflow: auto; background: var(--overlay); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 10.5px; line-height: 1.55; color: var(--ink-mid); z-index: 60; }
  .state h3 { margin: 0 0 4px; font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .state b { color: var(--ink); font-weight: 600; }
  .state .log { border-top: 1px solid var(--line-strong); margin-top: 6px; padding-top: 5px; }
  .state .log div { color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state .log div.act { color: var(--ink-mid); font-weight: 600; }

  /* ── floating switcher (high contrast on purpose) ───────────────── */
  .switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 70; display: flex; align-items: center; gap: 10px; background: #000; border: 1px solid var(--line-strong); border-radius: 9999px; padding: 6px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.7); font-size: 11px; color: #cfd6de; }
  .switcher button { border-radius: 9999px; padding: 2px 8px; background: #1f1f1f; }
  .switcher button:hover { background: var(--hover); }
  .switcher .vname { font-weight: 600; min-width: 130px; text-align: center; color: #fff; }
  .switcher label { display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; }
  .switcher select { background: #1f1f1f; color: inherit; border: 1px solid var(--line-strong); border-radius: 6px; font: inherit; padding: 1px 4px; }
  .hidden-note { color: var(--ink-faint); font-size: 11px; font-style: italic; }
</style>
</head>
<body>

<header class="titlebar">
  <span class="brand-dot"></span>
  <span class="brand">omp<span>-ui</span></span>
  <button class="icon-btn" title="collapse sidebar (fake)"><svg class="glyph" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg></button>
  <span class="hud-title">native transcript tab (fake host chrome)</span>
  <!-- the corner-tools trigger mounts HERE, before the inset spacer -->
  <div id="trigger-slot" style="display:flex;align-items:center;height:100%"></div>
  <div class="caption-spacer"></div>
  <span class="caption-note">OVERLAY_INSET (native caption buttons)</span>
</header>

<div class="app-body">
  <aside class="fake-sidebar">fake sidebar<br><br>· omp-ui — Working (0)<br>· Settled</aside>
  <main class="fake-main">PROTOTYPE corner tools — everything outside the header is set dressing</main>
</div>

<!-- variant D docks here -->
<div id="dock-slot"></div>

<div class="state" id="state-panel"></div>

<nav class="switcher" id="switcher"></nav>

<script>
"use strict";
/* ═══════════════ fake data & backend ═══════════════ */

const PROJECTS = [
  { id: "omp-ui", name: "omp-ui", path: "/home/alankford/Documents/Repos/LankfordAI/omp-ui",
    machine: "this computer", instanceId: null },
  { id: "payments-api", name: "payments-api", path: "/srv/work/payments-api",
    machine: "dev-01 (paired)", instanceId: "dev-01" },
  { id: "wayfinder", name: "Tidepool wayfinder", path: "/home/alankford/Documents/Repos/LankfordAI/Tidepool/wayfinder",
    machine: "this computer", instanceId: null },
];

const flags = { vsCode: true, terminal: true, remoteFocused: false, compact: false };
/* Flags mirror into URL params (?vsCode=0&remote=1&compact=1) so any state is
   one URL deep — and the bottom-bar toggles keep the URL in sync. */
const q0 = new URLSearchParams(location.search);
if (q0.get("vsCode") === "0") flags.vsCode = false;
if (q0.get("terminal") === "0") flags.terminal = false;
if (q0.get("remote") === "1") flags.remoteFocused = true;
if (q0.get("compact") === "1") flags.compact = true;
let focusId = "omp-ui"; // remoteFocused forces focus onto the paired project

function focusedProject() {
  return flags.remoteFocused ? PROJECTS.find(p => p.id === "payments-api") : PROJECTS.find(p => p.id === focusId);
}
/* Fake backend — every call lands in the visible log. */
const backend = {
  getProjectOpenAvailability() {
    const p = focusedProject();
    const local = p.instanceId === null;
    const a = { vsCode: local && flags.vsCode, terminal: local && flags.terminal };
    log(`backend.getProjectOpenAvailability(${p.id}) → {vsCode:${a.vsCode}, terminal:${a.terminal}}`, false);
    return a;
  },
  openProject(kind) {
    const p = focusedProject();
    log(`FAKE backend.openProject("${p.path}", "${kind}")`, true);
  },
  newSession() { log(`FAKE openProjectQuickOpen("${focusedProject().id}") → New session dialog`, true); },
  projectSettings() { log(`FAKE openSettingsPage(project: "${focusedProject().id}")`, true); },
};

/* gating, mirroring the real rules */
function gateAllows() {
  const p = focusedProject();
  if (flags.compact) return { ok: false, why: "hidden — compact shell" };
  if (p.instanceId !== null) return { ok: true, remote: true }; // pair focused → Remote-SSH row only
  return { ok: true, remote: false };
}

/* ═══════════════ state + logging ═══════════════ */

let uiState = { variant: "card", openState: "closed", pinned: false, lastTimer: "—", lastRow: "—" };
const eventLog = [];
function log(msg, act) {
  eventLog.unshift(`${new Date().toLocaleTimeString("en-GB")} ${msg}`);
  if (eventLog.length > 14) eventLog.pop();
  if (act) uiState.lastRow = msg.replace(/^FAKE /, "");
  renderState();
}
function setState(patch) { Object.assign(uiState, patch); renderState(); }

function renderState() {
  const p = focusedProject();
  const gate = gateAllows();
  document.getElementById("state-panel").innerHTML =
    `<h3>PROTOTYPE state</h3>` +
    `variant <b>${uiState.variant}</b> · card <b>${gate.ok ? uiState.openState : gate.why}</b>` + (gate.ok ? ` · pinned <b>${uiState.pinned}</b>` : "") + `<br>` +
    `last timer <b>${uiState.lastTimer}</b><br>` +
    `focused project <b>${p.id}</b> (${p.instanceId === null ? "local" : "remote " + p.instanceId})<br>` +
    `availability vsCode=<b>${flags.vsCode}</b> terminal=<b>${flags.terminal}</b><br>` +
    `last row <b>${esc(uiState.lastRow)}</b>` +
    `<div class="log">${eventLog.map(e => `<div class="${e.includes("FAKE") ? "act" : ""}">${esc(e)}</div>`).join("")}</div>`;
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

/* ═══════════════ shared card content ═══════════════ */

function monogramEl(p) {
  let h = 0; for (const c of p.id) h = (h * 31 + c.charCodeAt(0)) % 360;
  const el = document.createElement("span");
  el.className = "monogram";
  el.style.background = `hsl(${h} 45% 28%)`;
  el.style.color = `hsl(${h} 70% 80%)`;
  el.textContent = p.name.split(/[\s./-]+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  return el;
}
const G = {
  plus: '<svg class="glyph" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>',
  tune: '<svg class="glyph" viewBox="0 0 16 16"><path d="M2 4.5h7M12.5 4.5H14M2 11.5h3M8.5 11.5H14"/><circle cx="10.75" cy="4.5" r="1.6"/><circle cx="6.75" cy="11.5" r="1.6"/></svg>',
  vs:   '<svg class="glyph" viewBox="0 0 16 16"><path d="M11 2.5l3 1.5v8l-3 1.5-6-5.5M11 2.5L2 8l2 5 7-5"/></svg>',
  files:'<svg class="glyph" viewBox="0 0 16 16"><path d="M2 4a1 1 0 011-1h3.5l1.5 2H13a1 1 0 011 1v6a1 1 0 01-1 1H3a1 1 0 01-1-1z"/></svg>',
  term: '<svg class="glyph" viewBox="0 0 16 16"><path d="M3 4l4 4-4 4M8.5 12h4.5"/></svg>',
  gear: '<svg class="glyph" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4"/></svg>',
  chev: '<svg class="glyph" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></svg>',
  ssh:  '<svg class="glyph" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8" rx="1"/><path d="M5.5 14h5"/></svg>',
};
function row(glyph, label, hint, opts = {}) {
  const b = document.createElement("button");
  b.className = "menu-row";
  b.innerHTML = `<span class="g">${glyph}</span><span>${esc(label)}</span>${hint ? `<span class="hint">${esc(hint)}</span>` : ""}`;
  if (opts.disabled) { b.disabled = true; b.title = opts.title || ""; }
  else b.addEventListener("click", (e) => { e.stopPropagation(); opts.onClick(); closeAll(); });
  return b;
}

/** The decided content set. `grouped` widens it for variant C. */
function buildCardBody(grouped) {
  const p = focusedProject();
  const wrap = document.createElement("div");

  if (!grouped) {
    const head = document.createElement("div");
    head.className = "id-head";
    head.appendChild(monogramEl(p));
    const who = document.createElement("div"); who.className = "who";
    who.innerHTML = `<div class="name">${esc(p.name)}</div><div class="sub">${esc(p.machine)} · ${esc(p.path)}</div>`;
    head.appendChild(who);
    wrap.appendChild(head);
    wrap.appendChild(sepEl());
  }

  const addRow = (glyph, label, hint, cb) =>
    wrap.appendChild(row(glyph, label, hint, { onClick: cb }));

  if (grouped) label(wrap, "Session");
  addRow(G.plus, "New session", "⌘O", () => backend.newSession());

  const gate = gateAllows();
  if (gate.remote) {
    wrap.appendChild(sepEl());
    if (grouped) label(wrap, "Open in");
    const reason = `The pair ${p.machine} owns this checkout; open targets run on the remote host.`;
    wrap.appendChild(row(G.ssh, "Remote-SSH", "n/a", { disabled: true, title: reason, onClick: () => {} }));
    const d = document.createElement("div");
    d.className = "remote-reason";
    d.textContent = reason;
    wrap.appendChild(d);
  } else {
    wrap.appendChild(sepEl());
    if (grouped) label(wrap, "Open in");
    const a = backend.avail || backend.getProjectOpenAvailability();
    if (a.vsCode) addRow(G.vs, "Open in VS Code", "vscode", () => backend.openProject("vscode"));
    addRow(G.files, "Open in Files", "", () => backend.openProject("files"));
    if (a.terminal) addRow(G.term, "Open in Terminal", "", () => backend.openProject("terminal"));
  }

  wrap.appendChild(sepEl());
  if (grouped) label(wrap, "Project");
  addRow(G.gear, "Project settings", "", () => backend.projectSettings());
  return wrap;
}
function sepEl() { const s = document.createElement("div"); s.className = "sep"; return s; }
function label(w, t) { const l = document.createElement("div"); l.className = "group-label"; l.textContent = t; w.appendChild(l); }

/* ═══════════════ hover/pin state machine (shared by card variants) ═══ */

const OPEN_DELAY_MS = 200, LEAVE_GRACE_MS = 400;
let openTimer = null, graceTimer = null, activePanelHost = null, fanEl = null;

function hoverEnter(makePanel, anchor) {
  clearTimeout(graceTimer);
  if (uiState.openState !== "closed" || uiState.pinned) return;
  openTimer = setTimeout(() => {
    setState({ openState: "hover-open", lastTimer: `open-delay (${OPEN_DELAY_MS}ms) fired` });
    showPanel(makePanel(), anchor);
  }, OPEN_DELAY_MS);
}
/** True when the pointer ended inside the open panel's rect (with slack):
 *  crossing the trigger→panel gap must not count as "left the widget". */
function landedOnPanel(e) {
  if (!activePanelHost || !e || e.clientX === undefined) return false;
  const r = activePanelHost.getBoundingClientRect();
  const s = 8; // slack bridges the 4px trigger↔panel gap
  return e.clientX >= r.left - s && e.clientX <= r.right + s && e.clientY >= r.top - s && e.clientY <= r.bottom + s;
}
function hoverLeave(e) {
  clearTimeout(openTimer);
  if (uiState.pinned) return;
  if (landedOnPanel(e)) return; // pointer is on the panel; its own leave will arm grace
  graceTimer = setTimeout(() => {
    if (!uiState.pinned && uiState.openState !== "closed") {
      setState({ openState: "closed", lastTimer: `leave-grace (${LEAVE_GRACE_MS}ms) fired` });
      hidePanel();
    }
  }, LEAVE_GRACE_MS);
}
function togglePin(makePanel, anchor, labelTxt) {
  clearTimeout(openTimer); clearTimeout(graceTimer);
  if (uiState.pinned) {
    setState({ openState: "closed", pinned: false, lastTimer: "unpinned by click" });
    hidePanel();
  } else {
    setState({ openState: "pinned", pinned: true, lastTimer: "click-to-pin" });
    showPanel(makePanel(), anchor);
    log(`pinned corner tools (${labelTxt})`, false);
  }
}
/** Portaled panel gets its OWN pointer handlers (WorktreeChip lesson): the
 *  grace timer must cancel while the pointer is on the panel, and restart
 *  when it leaves — otherwise outside-trigger leave fires mid-hover. */
function showPanel(el, anchor) {
  hidePanelDom();
  activePanelHost = el;
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth; // read AFTER append so width is measured, not 0
  el.style.top = `${r.bottom + 4}px`;
  el.style.left = `${Math.max(4, Math.min(window.innerWidth - w - 4, r.right - w))}px`;
  el.addEventListener("pointerenter", () => clearTimeout(graceTimer));
  el.addEventListener("pointerleave", () => hoverLeave());
}
function hidePanel() { hidePanelDom(); }
function hidePanelDom() { if (activePanelHost) { activePanelHost.remove(); activePanelHost = null; } if (fanEl) fanEl.classList.remove("expanded"); }
function closeAll(reason) {
  clearTimeout(openTimer); clearTimeout(graceTimer);
  if (uiState.openState !== "closed" || uiState.pinned) {
    setState({ openState: "closed", pinned: false, lastTimer: reason || uiState.lastTimer });
    hidePanel();
  }
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeAll("Escape pressed");
});
document.addEventListener("mousedown", (e) => {
  if (activePanelHost && !activePanelHost.contains(e.target) && !e.target.closest("[data-trigger]")) {
    closeAll("outside click");
  }
});

/* ═══════════════ VARIANTS ═══════════════ */

/** A — card: icon trigger → T3-style compact menu card. Tests: does the
 *    existing popover convention + flat MenuRows carry the whole set? */
function renderCard(slot, projectSlot) {
  const btn = document.createElement("button");
  btn.className = "icon-btn"; btn.dataset.trigger = "1";
  btn.title = "Project tools"; btn.innerHTML = G.tune;
  const makePanel = () => {
    const p = document.createElement("div");
    p.className = "panel"; p.style.width = "250px";
    p.appendChild(buildCardBody(false));
    return p;
  };
  btn.addEventListener("mouseenter", () => hoverEnter(makePanel, btn));
  btn.addEventListener("mouseleave", hoverLeave);
  btn.addEventListener("click", (e) => { e.stopPropagation(); togglePin(makePanel, btn, "card"); });
  slot.appendChild(btn);
}

/** B — fan: no card at all; one monogram anchor + icon strip that fans out
 *    horizontally on hover. Tests: can label-less icons replace the menu? */
function renderFan(slot) {
  const p0 = focusedProject();
  const fan = document.createElement("div");
  fan.className = "fan"; fan.dataset.trigger = "1";
  fanEl = fan;
  const anchor = document.createElement("button");
  anchor.className = "icon-btn"; anchor.style.width = "28px"; anchor.title = p0.name;
  const m = monogramEl(p0); m.style.width = "18px"; m.style.height = "18px"; m.style.borderRadius = "5px"; m.style.fontSize = "8px";
  anchor.appendChild(m);
  fan.appendChild(anchor);
  const items = [];
  const gate = gateAllows();
  const avail = gate.remote ? { vsCode: false, terminal: false } : backend.getProjectOpenAvailability();
  const defs = [["New session", G.plus, () => backend.newSession()]];
  if (gate.remote) defs.push(["Remote-SSH (disabled — pair owns the checkout)", G.ssh, null]);
  else {
    if (avail.vsCode) defs.push(["Open in VS Code", G.vs, () => backend.openProject("vscode")]);
    defs.push(["Open in Files", G.files, () => backend.openProject("files")]);
    if (avail.terminal) defs.push(["Open in Terminal", G.term, () => backend.openProject("terminal")]);
  }
  defs.push(["Project settings", G.gear, () => backend.projectSettings()]);
  for (const [label, glyph, cb] of defs) {
    const b = document.createElement("button");
    b.className = "icon-btn fan-item"; b.title = label;
    b.style.height = "28px";
    if (!cb) { b.disabled = true; b.style.opacity = ".45"; }
    b.innerHTML = glyph;
    b.addEventListener("click", (e) => { e.stopPropagation(); if (cb) cb(); fan.classList.remove("expanded"); setState({ openState: "closed", pinned: false, lastTimer: "row clicked → collapsed" }); });
    fan.appendChild(b); items.push(b);
  }
  fan.addEventListener("mouseenter", () => {
    clearTimeout(graceTimer);
    if (uiState.pinned) return;
    openTimer = setTimeout(() => {
      fan.classList.add("expanded");
      setState({ openState: "hover-open", lastTimer: `open-delay (${OPEN_DELAY_MS}ms) fired` });
    }, OPEN_DELAY_MS);
  });
  fan.addEventListener("mouseleave", () => {
    clearTimeout(openTimer);
    if (uiState.pinned) return;
    graceTimer = setTimeout(() => {
      if (!uiState.pinned) {
        fan.classList.remove("expanded");
        setState({ openState: "closed", lastTimer: `leave-grace (${LEAVE_GRACE_MS}ms) fired` });
      }
    }, LEAVE_GRACE_MS);
  });
  anchor.addEventListener("click", (e) => {
    e.stopPropagation();
    clearTimeout(openTimer); clearTimeout(graceTimer);
    if (uiState.pinned) { setState({ openState: "closed", pinned: false, lastTimer: "unpinned by click" }); fan.classList.remove("expanded"); }
    else { setState({ openState: "pinned", pinned: true, lastTimer: "click-to-pin" }); fan.classList.add("expanded"); log("pinned fan", false); }
  });
  slot.appendChild(fan);
}

/** C — chip: trigger shows the project identity itself; expands into a wider
 *    grouped panel with labelled sections. Tests: does identity-on-trigger
 *    orientation justify a wider, sectioned surface? */
function renderChip(slot) {
  const p0 = focusedProject();
  const chip = document.createElement("button");
  chip.className = "chip"; chip.dataset.trigger = "1";
  const m = monogramEl(p0); m.style.width = "18px"; m.style.height = "18px"; m.style.borderRadius = "5px"; m.style.fontSize = "8px";
  chip.appendChild(m);
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p0.name;
  chip.appendChild(nm);
  chip.appendChild(Object.assign(document.createElement("span"), { innerHTML: G.chev })).style.cssText = "color:var(--ink-faint);transform:rotate(90deg)";
  const makePanel = () => {
    const p = document.createElement("div");
    p.className = "panel"; p.style.width = "300px";
    const head = document.createElement("div");
    head.className = "id-head";
    head.appendChild(monogramEl(p0));
    const who = document.createElement("div"); who.className = "who";
    who.innerHTML = `<div class="name">${esc(p0.name)}</div><div class="sub">${esc(p0.machine)} · ${esc(p0.path)}</div>`;
    head.appendChild(who);
    p.appendChild(head);
    p.appendChild(buildCardBody(true));
    return p;
  };
  chip.addEventListener("mouseenter", () => hoverEnter(makePanel, chip));
  chip.addEventListener("mouseleave", hoverLeave);
  chip.addEventListener("click", (e) => { e.stopPropagation(); togglePin(makePanel, chip, "chip"); });
  slot.appendChild(chip);
}

/** D — dock: an always-visible two-line mini card under the title bar; rows
 *    expand on hover. Tests: does ambient presence beat on-demand popovers? */
function renderDock() {
  const p0 = focusedProject();
  const dock = document.createElement("div");
  dock.className = "dock"; dock.dataset.trigger = "1"; dock.title = "Hover for tools";
  const r1 = document.createElement("div"); r1.className = "row1";
  const m = monogramEl(p0); m.style.width = "22px"; m.style.height = "22px";
  r1.appendChild(m);
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p0.name;
  r1.appendChild(nm);
  const ch = document.createElement("span"); ch.innerHTML = G.chev; ch.style.cssText = "margin-left:auto;color:var(--ink-faint)";
  r1.appendChild(ch);
  dock.appendChild(r1);
  const r2 = document.createElement("div"); r2.className = "row2";
  r2.textContent = `${p0.machine} · ${p0.path}`;
  dock.appendChild(r2);
  const makePanel = () => {
    const p = document.createElement("div");
    p.className = "panel";
    p.appendChild(buildCardBody(false));
    return p;
  };
  dock.addEventListener("mouseenter", () => hoverEnter(makePanel, dock));
  dock.addEventListener("mouseleave", hoverLeave);
  dock.addEventListener("click", (e) => { e.stopPropagation(); togglePin(makePanel, dock, "dock"); });
  return dock;
}

/* ═══════════════ switcher + mount ═══════════════ */

const VARIANTS = [
  { key: "card", name: "A — title-bar card" },
  { key: "fan",  name: "B — icon fan" },
  { key: "chip", name: "C — monogram chip" },
  { key: "dock", name: "D — docked mini card" },
];

function currentVariant() {
  const q = new URLSearchParams(location.search).get("variant");
  return VARIANTS.some(v => v.key === q) ? q : "card";
}
function setVariant(key, push) {
  const u = new URL(location.href); u.searchParams.set("variant", key);
  history[push ? "pushState" : "replaceState"](null, "", u);
  hidePanel();
  setState({ variant: key, openState: "closed", pinned: false, lastTimer: "—", lastRow: "—" });
  mount();
}
function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set("vsCode", flags.vsCode ? "1" : "0");
  u.searchParams.set("terminal", flags.terminal ? "1" : "0");
  u.searchParams.set("remote", flags.remoteFocused ? "1" : "0");
  u.searchParams.set("compact", flags.compact ? "1" : "0");
  history.replaceState(null, "", u);
}

function mount() {
  const slot = document.getElementById("trigger-slot");
  const dockSlot = document.getElementById("dock-slot");
  slot.innerHTML = ""; dockSlot.innerHTML = "";
  hidePanel();
  const gate = gateAllows();
  if (!gate.ok) {
    const n = document.createElement("span");
    n.className = "hidden-note"; n.style.cssText = "height:100%;display:flex;align-items:center;padding-right:8px";
    n.textContent = "(corner tools hidden — compact shell)";
    slot.appendChild(n);
    renderState();
  } else {
    backend.getProjectOpenAvailability(); // mirrors the real availability fetch on focus change
    const v = uiState.variant;
    if (v === "card") renderCard(slot);
    else if (v === "fan") renderFan(slot);
    else if (v === "chip") renderChip(slot);
    else if (v === "dock") dockSlot.appendChild(renderDock());
    renderState();
  }
  renderSwitcher();
}

function renderSwitcher() {
  const bar = document.getElementById("switcher");
  bar.innerHTML = "";
  const prev = document.createElement("button"); prev.textContent = "‹";
  const next = document.createElement("button"); next.textContent = "›";
  const i = VARIANTS.findIndex(v => v.key === uiState.variant);
  const cyc = (d) => setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key, false);
  prev.onclick = () => cyc(-1); next.onclick = () => cyc(1);
  const nm = document.createElement("span"); nm.className = "vname";
  nm.textContent = VARIANTS[i].name;
  bar.append(prev, nm, next);
  const mkToggle = (labelTxt, key) => {
    const l = document.createElement("label");
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = flags[key];
    c.onchange = () => { flags[key] = c.checked; setState({ openState: "closed", pinned: false }); syncUrl(); mount(); log(`toggle ${key} → ${c.checked}`, false); };
    l.append(c, document.createTextNode(labelTxt)); bar.appendChild(l);
  };
  mkToggle("vsCode", "vsCode");
  mkToggle("terminal", "terminal");
  mkToggle("remote pair", "remoteFocused");
  mkToggle("compact shell", "compact");
  const sel = document.createElement("select");
  for (const p of PROJECTS) { const o = document.createElement("option"); o.value = p.id; o.textContent = p.id; if (p.id === focusId) o.selected = true; sel.appendChild(o); }
  sel.onchange = () => { focusId = sel.value; flags.remoteFocused = false; setState({ openState: "closed", pinned: false }); mount(); log(`focus project → ${focusId}`, false); };
  const sl = document.createElement("label"); sl.append(document.createTextNode("project"), sel); bar.appendChild(sl);
}

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea,select,[contenteditable]")) return;
  const i = VARIANTS.findIndex(v => v.key === uiState.variant);
  if (e.key === "ArrowRight") setVariant(VARIANTS[(i + 1) % VARIANTS.length].key, false);
  if (e.key === "ArrowLeft") setVariant(VARIANTS[(i - 1 + VARIANTS.length) % VARIANTS.length].key, false);
});

setState({ variant: currentVariant() });
mount();
/* ?open=1 pins the card open on load — screenshots/review without a mouse. */
if (new URLSearchParams(location.search).get("open") === "1") {
  setTimeout(() => {
    const el = document.querySelector(".fan .icon-btn") || document.querySelector(".dock") || document.querySelector("[data-trigger]");
    el?.click();
    /* &row= additionally clicks the nth enabled fan item — smoke hook. */
    const rowN = new URLSearchParams(location.search).get("row");
    if (rowN !== null) {
      const items = [...document.querySelectorAll(".fan-item:not([disabled])")];
      setTimeout(() => items[Number(rowN)]?.click(), 5);
    }
  }, 0);
}
</script>
