<style>
    .s{fill:#fff8e7}
    .s0{animation:tw 3.1s ease-in-out infinite}
    .s1{animation:tw 4.3s ease-in-out infinite}
    .s2{animation:tw 5.7s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    .ga{animation:da 24s ease-in-out infinite alternate}
    .gb{animation:db 31s ease-in-out infinite alternate}
    @keyframes da{from{transform:translate(0,0)}to{transform:translate(420px,120px)}}
    @keyframes db{from{transform:translate(0,0)}to{transform:translate(-380px,-90px)}}
    .aur{animation:au 9s ease-in-out infinite alternate;transform-origin:800px 300px}
    @keyframes au{from{transform:skewX(-8deg) scaleY(.9);opacity:.55}to{transform:skewX(8deg) scaleY(1.1);opacity:.95}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
